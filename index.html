<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f1f;
        --panel: #121a2b;
        --panel-2: #1b2640;
        --text: #f8fbff;
        --accent: #22d3ee;
        --good: #34d399;
        --bad: #fb7185;
        --muted: #9fb2d1;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1d4ed8 0%, #0b1226 38%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .game {
        width: min(900px, 100%);
        background: linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid #2b3b61;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(34 211 238 / 0.08) inset;
        padding: 20px;
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
      }

      .status {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .card {
        background: #0f172a;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }

      .card strong {
        display: block;
        font-size: 1.15rem;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .word {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 20px;
      }

      .letter {
        width: 40px;
        height: 50px;
        border-bottom: 3px solid var(--accent);
        box-shadow: 0 6px 20px rgb(34 211 238 / 0.12);
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .guess-panel,
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }

      .guess-panel {
        margin-bottom: 8px;
      }

      input {
        text-align: center;
        font-size: 1.05rem;
        text-transform: uppercase;
        border-radius: 10px;
        border: 1px solid #2b3b61;
        padding: 8px 10px;
        background: #0f172a;
        color: var(--text);
      }

      #guess-input {
        width: min(380px, 100%);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, filter 160ms ease;
      }

      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .guess-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        color: #04131d;
      }

      .restart-btn {
        background: linear-gradient(135deg, #334155 0%, #1f2937 100%);
        color: var(--text);
      }

      .hint-btn {
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        color: #1a0e00;
      }

      .history,
      .hint {
        margin-top: 12px;
        text-align: center;
      }

      .hint {
        color: #fcd34d;
        min-height: 1.4em;
      }

      .message {
        margin-top: 10px;
        text-align: center;
        min-height: 1.4em;
        font-weight: 600;
      }

      .win { color: var(--good); }
      .lose { color: var(--bad); }

      .modal {
        position: fixed;
        inset: 0;
        background: rgb(2 6 23 / 0.72);
        backdrop-filter: blur(3px);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 20;
      }

      .modal.hidden { display: none; }

      .modal-card {
        width: min(560px, 100%);
        background: linear-gradient(165deg, #10192e 0%, #1a2742 100%);
        border: 1px solid #35507e;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.6);
        padding: 20px;
        text-align: center;
      }

      .modal-card h2 { margin: 0 0 10px; }
      .modal-card p { margin: 0 0 16px; color: var(--muted); }

      @media (max-width: 760px) {
        .status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #guess-input { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>Memora ⏳</h1>
      <p class="meta" id="meta"></p>

      <section class="status">
        <div class="card">Nivel<strong id="level">1/20</strong></div>
        <div class="card">Puntos<strong id="points">0/3</strong></div>
        <div class="card">Tiempo<strong id="time">45</strong></div>
        <div class="card">Intentos<strong id="attempts">7</strong></div>
        <div class="card">Errores<strong id="errors">0</strong></div>
        <div class="card">+Tiempo letra<strong id="bonus">+4s</strong></div>
      </section>

      <section class="word" id="word" aria-label="Palabra a adivinar"></section>

      <form class="guess-panel" id="guess-form">
        <input id="guess-input" type="text" autocomplete="off" required aria-label="Escribe una letra o palabra completa" placeholder="" />
        <button class="guess-btn" type="submit">▶</button>
      </form>

      <div class="actions">
        <button class="hint-btn" id="hint-btn" type="button">PISTA (-1)</button>
        <button class="restart-btn" id="restart-btn" type="button">Reiniciar nivel</button>
      </div>

      <p class="history">Letras usadas: <span id="used">(ninguna)</span></p>
      <p class="hint" id="hint">Pista: (oculta)</p>
      <p class="message" id="message"></p>
    </main>

    <div class="modal hidden" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <button class="guess-btn" id="modal-action" type="button">Continuar</button>
      </div>
    </div>

    <script>
      const LEVELS = [
        { theme: 'vida diaria', bonus: 4, targetPoints: 3, words: [{ word: 'CASA', hint: 'Lugar donde vives.' }, { word: 'LLAVE', hint: 'Sirve para abrir puertas.' }, { word: 'MESA', hint: 'Mueble para comer o trabajar.' }] },
        { theme: 'animales', bonus: 4, targetPoints: 3, words: [{ word: 'PERRO', hint: 'Animal doméstico leal.' }, { word: 'GATO', hint: 'Felino doméstico.' }, { word: 'CONEJO', hint: 'Animal de orejas largas.' }] },
        { theme: 'ciudad', bonus: 4, targetPoints: 3, words: [{ word: 'PARQUE', hint: 'Espacio verde urbano.' }, { word: 'PLAZA', hint: 'Espacio público de reunión.' }, { word: 'CALLE', hint: 'Vía dentro de la ciudad.' }] },
        { theme: 'hogar', bonus: 4, targetPoints: 3, words: [{ word: 'VENTANA', hint: 'Abertura que deja entrar luz.' }, { word: 'COCINA', hint: 'Lugar donde preparas comida.' }, { word: 'SILLA', hint: 'Asiento con respaldo.' }] },
        { theme: 'objetos', bonus: 4, targetPoints: 3, words: [{ word: 'RELOJ', hint: 'Indica la hora.' }, { word: 'MOCHILA', hint: 'Sirve para cargar cosas.' }, { word: 'CUADERNO', hint: 'Se usa para escribir notas.' }] },
        { theme: 'movilidad', bonus: 4, targetPoints: 3, words: [{ word: 'BICICLETA', hint: 'Vehículo de dos ruedas.' }, { word: 'AUTOBUS', hint: 'Transporte público colectivo.' }, { word: 'METRO', hint: 'Tren urbano subterráneo.' }] },
        { theme: 'tiempo', bonus: 3, targetPoints: 3, words: [{ word: 'CALENDARIO', hint: 'Organiza días y meses.' }, { word: 'SEMANA', hint: 'Período de siete días.' }, { word: 'ESTACION', hint: 'División climática del año.' }] },
        { theme: 'naturaleza', bonus: 3, targetPoints: 3, words: [{ word: 'MURCIELAGO', hint: 'Mamífero que vuela de noche.' }, { word: 'BOSQUE', hint: 'Terreno poblado de árboles.' }, { word: 'MONTAÑA', hint: 'Elevación natural del terreno.' }] },
        { theme: 'geografía', bonus: 3, targetPoints: 3, words: [{ word: 'VOLCAN', hint: 'Montaña que puede expulsar lava.' }, { word: 'DESIERTO', hint: 'Zona árida con poca lluvia.' }, { word: 'OCEANO', hint: 'Gran masa de agua salada.' }] },
        { theme: 'salud', bonus: 3, targetPoints: 3, words: [{ word: 'HOSPITAL', hint: 'Centro de atención médica.' }, { word: 'VACUNA', hint: 'Previene enfermedades.' }, { word: 'TERAPIA', hint: 'Tratamiento para mejorar salud.' }] },
        { theme: 'ciencia', bonus: 3, targetPoints: 3, words: [{ word: 'ECLIPSE', hint: 'Alineación de cuerpos celestes.' }, { word: 'ATOMO', hint: 'Unidad básica de la materia.' }, { word: 'GALAXIA', hint: 'Conjunto enorme de estrellas.' }] },
        { theme: 'sociedad', bonus: 3, targetPoints: 3, words: [{ word: 'DEMOCRACIA', hint: 'Sistema político participativo.' }, { word: 'CIUDADANIA', hint: 'Condición de pertenencia a un Estado.' }, { word: 'DERECHOS', hint: 'Garantías de las personas.' }] },
        { theme: 'historia', bonus: 2, targetPoints: 3, words: [{ word: 'ARQUEOLOGIA', hint: 'Estudia culturas antiguas por restos.' }, { word: 'REVOLUCION', hint: 'Cambio profundo de un sistema.' }, { word: 'IMPERIO', hint: 'Organización política extensa histórica.' }] },
        { theme: 'ecología', bonus: 2, targetPoints: 3, words: [{ word: 'BIODIVERSIDAD', hint: 'Variedad de especies en un entorno.' }, { word: 'ECOSISTEMA', hint: 'Relación entre seres vivos y entorno.' }, { word: 'RECICLAJE', hint: 'Transformar residuos para reutilizar.' }] },
        { theme: 'matemática', bonus: 2, targetPoints: 3, words: [{ word: 'HIPOTENUSA', hint: 'Lado mayor del triángulo rectángulo.' }, { word: 'FRACCION', hint: 'Expresa partes de un todo.' }, { word: 'GEOMETRIA', hint: 'Rama que estudia formas y espacio.' }] },
        { theme: 'lengua', bonus: 2, targetPoints: 3, words: [{ word: 'METAFORA', hint: 'Figura literaria de comparación implícita.' }, { word: 'SINTAXIS', hint: 'Reglas para combinar palabras.' }, { word: 'SEMANTICA', hint: 'Estudio del significado.' }] },
        { theme: 'finanzas', bonus: 2, targetPoints: 3, words: [{ word: 'CRIPTOMONEDA', hint: 'Activo digital con criptografía.' }, { word: 'INVERSION', hint: 'Colocar dinero para obtener ganancia.' }, { word: 'AHORRO', hint: 'Parte del ingreso que no se gasta.' }] },
        { theme: 'biología', bonus: 2, targetPoints: 3, words: [{ word: 'NEUROPLASTICIDAD', hint: 'Capacidad del cerebro para adaptarse.' }, { word: 'MITOCONDRIA', hint: 'Organelo que produce energía celular.' }, { word: 'GENETICA', hint: 'Estudia herencia biológica.' }] },
        { theme: 'física', bonus: 2, targetPoints: 3, words: [{ word: 'TERMODINAMICA', hint: 'Estudia calor y energía.' }, { word: 'GRAVEDAD', hint: 'Fuerza de atracción entre masas.' }, { word: 'INERCIA', hint: 'Tendencia a mantener estado de movimiento.' }] },
        { theme: 'educación', bonus: 2, targetPoints: 3, words: [{ word: 'INTERDISCIPLINARIO', hint: 'Integra varias áreas de conocimiento.' }, { word: 'PEDAGOGIA', hint: 'Disciplina sobre enseñanza.' }, { word: 'CURRICULO', hint: 'Plan de estudios estructurado.' }] },
      ];

      const ONLINE_MODE = true;
      const RANDOM_WORD_ENDPOINTS = [
        'https://random-word-api.herokuapp.com/word?number=1',
        'https://random-word-api.vercel.app/api?words=1',
      ];
      const MAX_LEVELS = LEVELS.length;
      const POINTS_PER_WORD = 1;

      const wordEl = document.getElementById('word');
      const timeEl = document.getElementById('time');
      const attemptsEl = document.getElementById('attempts');
      const errorsEl = document.getElementById('errors');
      const usedEl = document.getElementById('used');
      const messageEl = document.getElementById('message');
      const hintEl = document.getElementById('hint');
      const levelEl = document.getElementById('level');
      const pointsEl = document.getElementById('points');
      const metaEl = document.getElementById('meta');
      const bonusEl = document.getElementById('bonus');

      const guessForm = document.getElementById('guess-form');
      const guessInput = document.getElementById('guess-input');
      const hintBtn = document.getElementById('hint-btn');
      const restartBtn = document.getElementById('restart-btn');

      const modalEl = document.getElementById('result-modal');
      const modalTitleEl = document.getElementById('modal-title');
      const modalTextEl = document.getElementById('modal-text');
      const modalActionBtn = document.getElementById('modal-action');

      let levelIndex = 0;
      let levelPoints = 0;
      let usedWordIndexes = [];

      let secretWord = '';
      let currentHint = '';
      let guessedLetters = new Set();
      let wrongLetters = new Set();
      let attemptsLeft = 8;
      let timeLeft = 55;
      let timerId;
      let timerStarted = false;
      let gameOver = false;
      let hintUsed = false;

      const usedWordsCache = new Set();
      const definitionCache = new Map();

      function currentLevel() {
        return LEVELS[levelIndex];
      }

      function levelAttempts(index) {
        if (index < 6) return 8;
        if (index < 12) return 7;
        if (index < 17) return 6;
        return 5;
      }

      function levelTime(index) {
        if (index < 6) return 55;
        if (index < 12) return 50;
        if (index < 17) return 45;
        return 40;
      }

      function normalizeText(value) {
        return value
          .normalize('NFD')
          .replace(/[̀-ͯ]/g, '')
          .toUpperCase()
          .trim();
      }

      function sanitizeWord(rawWord) {
        return normalizeText(rawWord).replace(/[^A-ZÑ]/g, '');
      }

      async function fetchJsonWithTimeout(url, timeoutMs = 2500) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const response = await fetch(url, { signal: controller.signal });
          if (!response.ok) return null;
          return await response.json();
        } catch {
          return null;
        } finally {
          clearTimeout(timer);
        }
      }

      async function fetchOnlineDefinition(word) {
        const lower = word.toLowerCase();
        if (definitionCache.has(lower)) {
          return definitionCache.get(lower);
        }

        const data = await fetchJsonWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lower)}`);
        let definition = `Palabra obtenida online para el nivel de ${currentLevel().theme}.`;

        if (Array.isArray(data) && data[0]?.meanings?.length) {
          const firstMeaning = data[0].meanings[0];
          const firstDef = firstMeaning?.definitions?.[0]?.definition;
          if (firstDef) {
            definition = `Definición online: ${firstDef}`;
          }
        }

        definitionCache.set(lower, definition);
        return definition;
      }

      async function fetchOnlineWordEntry() {
        for (let attempt = 0; attempt < 8; attempt += 1) {
          const endpoint = RANDOM_WORD_ENDPOINTS[attempt % RANDOM_WORD_ENDPOINTS.length];
          const data = await fetchJsonWithTimeout(endpoint);
          const candidate = Array.isArray(data) ? sanitizeWord(data[0] || '') : '';

          if (!candidate || candidate.length < 4) continue;
          if (usedWordsCache.has(candidate)) continue;

          const hint = await fetchOnlineDefinition(candidate);
          return { word: candidate, hint, source: 'online' };
        }

        return null;
      }

      function pickOfflineWordEntry() {
        const words = currentLevel().words;

        let availableIndexes = words
          .map((entry, index) => ({ index, normalized: sanitizeWord(entry.word) }))
          .filter(({ normalized }) => normalized && !usedWordsCache.has(normalized))
          .map(({ index }) => index);

        if (availableIndexes.length === 0) {
          availableIndexes = words.map((_, index) => index);
        }

        const selected = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
        usedWordIndexes.push(selected);
        const entry = words[selected];

        return {
          word: sanitizeWord(entry.word),
          hint: entry.hint,
          source: 'offline',
        };
      }

      async function pickWordEntry() {
        if (ONLINE_MODE) {
          const online = await fetchOnlineWordEntry();
          if (online) return online;
        }
        return pickOfflineWordEntry();
      }

      function renderWord() {
        wordEl.innerHTML = '';
        for (const letter of secretWord) {
          const div = document.createElement('div');
          div.className = 'letter';
          div.textContent = guessedLetters.has(letter) ? letter : '';
          wordEl.appendChild(div);
        }
      }

      function updateStatus() {
        const level = currentLevel();
        levelEl.textContent = `${levelIndex + 1}/${MAX_LEVELS}`;
        pointsEl.textContent = `${levelPoints}/${level.targetPoints}`;
        timeEl.textContent = String(timeLeft);
        attemptsEl.textContent = String(attemptsLeft);
        errorsEl.textContent = String(wrongLetters.size);
        usedEl.textContent = wrongLetters.size ? [...wrongLetters].join(', ') : '(ninguna)';
        bonusEl.textContent = `+${level.bonus}s`;
        metaEl.textContent = `Tema: ${level.theme} · Dificultad ${levelIndex + 1}`;
      }

      function allLettersGuessed() {
        return [...secretWord].every((letter) => guessedLetters.has(letter));
      }

      function revealWord() {
        for (const letter of secretWord) guessedLetters.add(letter);
        renderWord();
      }

      function openResultModal({ win, title, actionText, onAction, reason = '' }) {
        const definitionText = `Definición: ${currentHint}`;
        modalEl.classList.remove('hidden');
        modalTitleEl.textContent = title;
        modalTextEl.textContent = `${definitionText}${reason ? ` · ${reason}` : ''}`;
        modalActionBtn.textContent = actionText;
        modalActionBtn.onclick = () => {
          modalEl.classList.add('hidden');
          onAction();
        };

        messageEl.textContent = 'Resultado disponible en la ventana emergente.';
        messageEl.className = win ? 'message win' : 'message lose';
      }

      function finishLoss(reason = '') {
        gameOver = true;
        clearInterval(timerId);
        revealWord();
        openResultModal({
          win: false,
          title: 'Inténtalo de nuevo',
          reason,
          actionText: 'Comenzar de nuevo',
          onAction: () => startLevel(),
        });
      }

      function finishWordSolved() {
        gameOver = true;
        clearInterval(timerId);
        levelPoints += POINTS_PER_WORD;
        updateStatus();

        if (levelPoints >= currentLevel().targetPoints) {
          if (levelIndex === MAX_LEVELS - 1) {
            openResultModal({
              win: true,
              title: 'Juego completado',
              actionText: 'Volver al nivel 1',
              onAction: () => {
                levelIndex = 0;
                startLevel();
              },
            });
            return;
          }

          openResultModal({
            win: true,
            title: 'Nivel superado',
            actionText: 'Siguiente nivel',
            onAction: () => {
              levelIndex += 1;
              startLevel();
            },
          });
          return;
        }

        openResultModal({
          win: true,
          title: 'Palabra acertada',
          actionText: 'Siguiente palabra',
          onAction: () => startRound(),
        });
      }

      function consumeAttemptAndCheckLose(reason) {
        attemptsLeft -= 1;
        updateStatus();
        if (attemptsLeft <= 0) {
          finishLoss(reason);
          return true;
        }
        return false;
      }

      function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (gameOver) {
            clearInterval(timerId);
            return;
          }

          timeLeft -= 1;
          updateStatus();
          if (timeLeft <= 0) finishLoss('Se acabó el tiempo');
        }, 1000);
      }

      function ensureTimerStarted() {
        if (!timerStarted && !gameOver) {
          timerStarted = true;
          startTimer();
        }
      }

      async function startRound() {
        const level = currentLevel();

        gameOver = true;
        hintEl.textContent = 'Pista: (oculta)';
        messageEl.textContent = 'Cargando palabra aleatoria...';
        messageEl.className = 'message';
        modalEl.classList.add('hidden');

        const entry = await pickWordEntry();
        secretWord = entry.word;
        currentHint = entry.hint;
        usedWordsCache.add(secretWord);

        guessedLetters = new Set();
        wrongLetters = new Set();
        attemptsLeft = levelAttempts(levelIndex);
        timeLeft = levelTime(levelIndex);
        gameOver = false;
        timerStarted = false;
        hintUsed = false;

        messageEl.textContent = 'Nueva palabra cargada. ¡A jugar!';
        messageEl.className = 'message';

        renderWord();
        updateStatus();
        guessInput.value = '';
        guessInput.focus();
      }

      function startLevel() {
        levelPoints = 0;
        usedWordIndexes = [];
        startRound();
      }

      function handleLetterGuess(rawValue) {
        ensureTimerStarted();
        const guess = normalizeText(rawValue);

        if (!/^[A-ZÑ]$/.test(guess)) {
          messageEl.textContent = 'Para letra, ingresa exactamente 1 carácter.';
          messageEl.className = 'message lose';
          return;
        }

        if (guessedLetters.has(guess) || wrongLetters.has(guess)) {
          messageEl.textContent = 'Esa letra ya fue usada.';
          messageEl.className = 'message';
          return;
        }

        if (secretWord.includes(guess)) {
          guessedLetters.add(guess);
          timeLeft += currentLevel().bonus;
          renderWord();
          updateStatus();

          if (allLettersGuessed()) {
            finishWordSolved();
          } else {
            messageEl.textContent = `¡Correcta! Ganaste +${currentLevel().bonus}s.`;
            messageEl.className = 'message win';
          }
          return;
        }

        wrongLetters.add(guess);
        updateStatus();
        const isLost = consumeAttemptAndCheckLose('Sin intentos');
        if (!isLost) {
          messageEl.textContent = 'Letra incorrecta: -1 intento.';
          messageEl.className = 'message lose';
        }
      }

      function handleWordGuess(rawValue) {
        ensureTimerStarted();
        const guessWord = normalizeText(rawValue);

        if (!guessWord || !/^[A-ZÑ]+$/.test(guessWord)) {
          messageEl.textContent = 'Ingresa una palabra válida (solo letras).';
          messageEl.className = 'message lose';
          return;
        }

        if (guessWord === secretWord) {
          revealWord();
          updateStatus();
          finishWordSolved();
          return;
        }

        const isLost = consumeAttemptAndCheckLose('Sin intentos');
        if (!isLost) {
          messageEl.textContent = 'Palabra incorrecta: -1 intento.';
          messageEl.className = 'message lose';
        }
      }

      guessForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (gameOver) return;

        const value = guessInput.value;
        guessInput.value = '';
        guessInput.focus();

        const normalized = normalizeText(value);
        if (!normalized) {
          messageEl.textContent = 'Ingresa una letra o palabra válida.';
          messageEl.className = 'message lose';
          return;
        }

        if (normalized.length === 1) {
          handleLetterGuess(normalized);
        } else {
          handleWordGuess(normalized);
        }
      });

      hintBtn.addEventListener('click', () => {
        if (gameOver) return;

        ensureTimerStarted();

        if (hintUsed) {
          messageEl.textContent = 'Ya usaste la pista en esta palabra.';
          messageEl.className = 'message';
          return;
        }

        hintUsed = true;
        hintEl.textContent = `Pista: ${currentHint}`;

        const isLost = consumeAttemptAndCheckLose('Te quedaste sin intentos por usar pista');
        if (!isLost) {
          messageEl.textContent = 'Pista usada: -1 intento.';
          messageEl.className = 'message';
        }
      });

      restartBtn.addEventListener('click', () => {
        startLevel();
        ensureTimerStarted();
      });

      startLevel();
