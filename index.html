<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adivina la palabra por niveles</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f1f;
        --panel: #121a2b;
        --panel-2: #1b2640;
        --text: #f8fbff;
        --accent: #22d3ee;
        --accent-2: #8b5cf6;
        --good: #34d399;
        --bad: #fb7185;
        --muted: #9fb2d1;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1d4ed8 0%, #0b1226 38%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .game {
        width: min(860px, 100%);
        background: linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid #2b3b61;
        border-radius: 18px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.55), 0 0 0 1px rgb(34 211 238 / 0.08) inset;
        padding: 20px;
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
      }

      .status {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .card {
        background: #0f172a;
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }

      .card strong {
        display: block;
        font-size: 1.25rem;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .word {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 20px;
      }

      .letter {
        width: 40px;
        height: 50px;
        border-bottom: 3px solid var(--accent);
        box-shadow: 0 6px 20px rgb(34 211 238 / 0.12);
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .guess-panel,
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }

      .guess-panel {
        margin-bottom: 8px;
      }

      input {
        text-align: center;
        font-size: 1.05rem;
        text-transform: uppercase;
        border-radius: 10px;
        border: 1px solid #2b3b61;
        padding: 8px 10px;
        background: #0f172a;
        color: var(--text);
      }

      #guess-input {
        width: min(380px, 100%);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }

      .guess-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        color: #04131d;
      }

      .restart-btn {
        background: linear-gradient(135deg, #334155 0%, #1f2937 100%);
        color: var(--text);
      }

      .hint-btn {
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        color: #1a0e00;
      }

      .next-btn {
        background: linear-gradient(135deg, var(--accent-2) 0%, #6366f1 100%);
        color: #f8fbff;
      }

      .history,
      .hint {
        margin-top: 12px;
        text-align: center;
      }

      .hint {
        color: #fcd34d;
        min-height: 1.4em;
      }

      .message {
        margin-top: 10px;
        text-align: center;
        min-height: 1.4em;
        font-weight: 600;
      }

      .win {
        color: var(--good);
      }

      .lose {
        color: var(--bad);
      }


      button {
        transition: transform 120ms ease, filter 160ms ease, box-shadow 160ms ease;
      }

      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      @media (max-width: 760px) {
        .status {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        #guess-input {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>Adivina la palabra por niveles ⏳</h1>
      <p class="meta" id="meta"></p>

      <section class="status">
        <div class="card">Nivel<strong id="level">1/20</strong></div>
        <div class="card">Tiempo<strong id="time">45</strong></div>
        <div class="card">Intentos<strong id="attempts">7</strong></div>
        <div class="card">Errores<strong id="errors">0</strong></div>
        <div class="card">+Tiempo letra<strong id="bonus">+4s</strong></div>
      </section>

      <section class="word" id="word" aria-label="Palabra a adivinar"></section>

      <form class="guess-panel" id="guess-form">
        <input id="guess-input" type="text" autocomplete="off" required aria-label="Escribe una letra o palabra completa" placeholder="Escribe una letra o una palabra" />
        <button class="guess-btn" type="submit">Probar intento</button>
      </form>

      <div class="actions">
        <button class="hint-btn" id="hint-btn" type="button">Usar pista (-1 intento)</button>
        <button class="restart-btn" id="restart-btn" type="button">Reiniciar nivel</button>
        <button class="next-btn" id="next-btn" type="button" hidden>Siguiente nivel</button>
      </div>

      <p class="history">Letras usadas: <span id="used">(ninguna)</span></p>
      <p class="hint" id="hint">Pista: (oculta)</p>
      <p class="message" id="message"></p>
    </main>

    <script>
      const LEVELS = [
        { word: 'CASA', hint: 'Lugar donde vives.', theme: 'vida diaria', bonus: 4 },
        { word: 'PERRO', hint: 'Animal doméstico muy común.', theme: 'animales', bonus: 4 },
        { word: 'MESA', hint: 'Mueble para comer o trabajar.', theme: 'hogar', bonus: 4 },
        { word: 'LLAVE', hint: 'Sirve para abrir una puerta.', theme: 'objetos', bonus: 4 },
        { word: 'PARQUE', hint: 'Espacio verde para caminar o jugar.', theme: 'ciudad', bonus: 4 },
        { word: 'BICICLETA', hint: 'Transporte de dos ruedas.', theme: 'movilidad', bonus: 4 },
        { word: 'CALENDARIO', hint: 'Organiza días, semanas y meses.', theme: 'tiempo', bonus: 3 },
        { word: 'MURCIELAGO', hint: 'Mamífero que vuela de noche.', theme: 'naturaleza', bonus: 3 },
        { word: 'VOLCAN', hint: 'Montaña que puede expulsar lava.', theme: 'geografía', bonus: 3 },
        { word: 'HOSPITAL', hint: 'Lugar de atención médica.', theme: 'salud', bonus: 3 },
        { word: 'ECLIPSE', hint: 'Fenómeno astronómico entre astros.', theme: 'ciencia', bonus: 3 },
        { word: 'DEMOCRACIA', hint: 'Sistema político de participación ciudadana.', theme: 'sociedad', bonus: 3 },
        { word: 'ARQUEOLOGIA', hint: 'Estudia culturas antiguas por restos materiales.', theme: 'historia', bonus: 2 },
        { word: 'BIODIVERSIDAD', hint: 'Variedad de especies en un ecosistema.', theme: 'ecología', bonus: 2 },
        { word: 'HIPOTENUSA', hint: 'Lado mayor en un triángulo rectángulo.', theme: 'matemática', bonus: 2 },
        { word: 'METAFORA', hint: 'Figura literaria que compara sin "como".', theme: 'lengua', bonus: 2 },
        { word: 'CRIPTOMONEDA', hint: 'Activo digital basado en criptografía.', theme: 'finanzas', bonus: 2 },
        { word: 'NEUROPLASTICIDAD', hint: 'Capacidad del cerebro de adaptarse.', theme: 'biología', bonus: 2 },
        { word: 'TERMODINAMICA', hint: 'Rama de la física sobre calor y energía.', theme: 'física', bonus: 2 },
        { word: 'INTERDISCIPLINARIO', hint: 'Integra conocimientos de distintas áreas.', theme: 'educación', bonus: 2 },
      ];

      const MAX_LEVELS = LEVELS.length;
      const BASE_ATTEMPTS = 8;
      const BASE_TIME = 55;

      const wordEl = document.getElementById('word');
      const timeEl = document.getElementById('time');
      const attemptsEl = document.getElementById('attempts');
      const errorsEl = document.getElementById('errors');
      const usedEl = document.getElementById('used');
      const messageEl = document.getElementById('message');
      const hintEl = document.getElementById('hint');
      const levelEl = document.getElementById('level');
      const metaEl = document.getElementById('meta');
      const bonusEl = document.getElementById('bonus');

      const guessForm = document.getElementById('guess-form');
      const guessInput = document.getElementById('guess-input');
      const hintBtn = document.getElementById('hint-btn');
      const restartBtn = document.getElementById('restart-btn');
      const nextBtn = document.getElementById('next-btn');

      let levelIndex = 0;
      let secretWord = '';
      let guessedLetters = new Set();
      let wrongLetters = new Set();
      let attemptsLeft = BASE_ATTEMPTS;
      let timeLeft = BASE_TIME;
      let timerId;
      let timerStarted = false;
      let gameOver = false;
      let hintUsed = false;

      function currentLevel() {
        return LEVELS[levelIndex];
      }

      function levelAttempts(index) {
        if (index < 6) return 8;
        if (index < 12) return 7;
        if (index < 17) return 6;
        return 5;
      }

      function levelTime(index) {
        if (index < 6) return 55;
        if (index < 12) return 50;
        if (index < 17) return 45;
        return 40;
      }

      function renderWord() {
        wordEl.innerHTML = '';
        for (const letter of secretWord) {
          const div = document.createElement('div');
          div.className = 'letter';
          div.textContent = guessedLetters.has(letter) ? letter : '';
          wordEl.appendChild(div);
        }
      }

      function updateStatus() {
        const level = currentLevel();
        levelEl.textContent = `${levelIndex + 1}/${MAX_LEVELS}`;
        timeEl.textContent = String(timeLeft);
        attemptsEl.textContent = String(attemptsLeft);
        errorsEl.textContent = String(wrongLetters.size);
        usedEl.textContent = wrongLetters.size ? [...wrongLetters].join(', ') : '(ninguna)';
        bonusEl.textContent = `+${level.bonus}s`;
        metaEl.textContent = `Tema: ${level.theme} · Dificultad ${levelIndex + 1}`;
      }

      function allLettersGuessed() {
        return [...secretWord].every((letter) => guessedLetters.has(letter));
      }

      function revealWord() {
        for (const letter of secretWord) {
          guessedLetters.add(letter);
        }
        renderWord();
      }

      function finishGame(win, reason = '') {
        gameOver = true;
        clearInterval(timerId);

        if (win) {
          if (levelIndex === MAX_LEVELS - 1) {
            messageEl.textContent = '¡Ganaste el nivel 20! Completaste todo el juego. 🎉';
            nextBtn.hidden = true;
          } else {
            messageEl.textContent = '¡Nivel superado! Puedes pasar al siguiente.';
            nextBtn.hidden = false;
          }
          messageEl.className = 'message win';
          return;
        }

        messageEl.textContent = `Perdiste${reason ? ` (${reason})` : ''}. La palabra era ${secretWord}.`;
        messageEl.className = 'message lose';
        nextBtn.hidden = true;
        revealWord();
      }

      function consumeAttemptAndCheckLose(reason) {
        attemptsLeft -= 1;
        updateStatus();
        if (attemptsLeft <= 0) {
          finishGame(false, reason);
          return true;
        }
        return false;
      }

      function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (gameOver) {
            clearInterval(timerId);
            return;
          }

          timeLeft -= 1;
          updateStatus();

          if (timeLeft <= 0) {
            finishGame(false, 'se acabó el tiempo');
          }
        }, 1000);
      }

      function ensureTimerStarted() {
        if (!timerStarted && !gameOver) {
          timerStarted = true;
          startTimer();
        }
      }

      function startLevel() {
        const level = currentLevel();
        secretWord = level.word.toUpperCase();
        guessedLetters = new Set();
        wrongLetters = new Set();
        attemptsLeft = levelAttempts(levelIndex);
        timeLeft = levelTime(levelIndex);
        gameOver = false;
        timerStarted = false;
        hintUsed = false;

        hintEl.textContent = 'Pista: (oculta)';
        messageEl.textContent = 'El tiempo comienza en tu primera acción: letra, palabra o botón.';
        messageEl.className = 'message';
        nextBtn.hidden = true;

        renderWord();
        updateStatus();

        guessInput.value = '';
        guessInput.focus();
      }

      function normalizeText(value) {
        return value
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase()
          .trim();
      }

      function handleLetterGuess(rawValue) {
        ensureTimerStarted();
        const guess = normalizeText(rawValue);

        if (!/^[A-ZÑ]$/.test(guess)) {
          messageEl.textContent = 'Para letra, ingresa exactamente 1 carácter.';
          messageEl.className = 'message lose';
          return;
        }

        if (guessedLetters.has(guess) || wrongLetters.has(guess)) {
          messageEl.textContent = 'Esa letra ya fue usada.';
          messageEl.className = 'message';
          return;
        }

        if (secretWord.includes(guess)) {
          guessedLetters.add(guess);
          timeLeft += currentLevel().bonus;
          renderWord();
          updateStatus();

          if (allLettersGuessed()) {
            finishGame(true);
          } else {
            messageEl.textContent = `¡Correcta! Ganaste +${currentLevel().bonus}s.`;
            messageEl.className = 'message win';
          }
        } else {
          wrongLetters.add(guess);
          updateStatus();
          const isLost = consumeAttemptAndCheckLose('sin intentos');
          if (!isLost) {
            messageEl.textContent = 'Letra incorrecta: -1 intento.';
            messageEl.className = 'message lose';
          }
        }
      }

      function handleWordGuess(rawValue) {
        ensureTimerStarted();
        const guessWord = normalizeText(rawValue);

        if (!guessWord || !/^[A-ZÑ]+$/.test(guessWord)) {
          messageEl.textContent = 'Ingresa una palabra válida (solo letras).';
          messageEl.className = 'message lose';
          return;
        }

        hintEl.textContent = `Definición: ${currentLevel().hint}`;

        if (guessWord === secretWord) {
          revealWord();
          updateStatus();
          finishGame(true);
          messageEl.textContent = `¡Acertaste la palabra! Definición: ${currentLevel().hint}`;
          messageEl.className = 'message win';
          return;
        }

        const isLost = consumeAttemptAndCheckLose('sin intentos');
        if (!isLost) {
          messageEl.textContent = `Palabra incorrecta: -1 intento. Definición: ${currentLevel().hint}`;
          messageEl.className = 'message lose';
        }
      }

      guessForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (gameOver) return;

        const value = guessInput.value;
        guessInput.value = '';
        guessInput.focus();

        const normalized = normalizeText(value);
        if (!normalized) {
          messageEl.textContent = 'Ingresa una letra o palabra válida.';
          messageEl.className = 'message lose';
          return;
        }

        if (normalized.length === 1) {
          handleLetterGuess(normalized);
        } else {
          handleWordGuess(normalized);
        }
      });

      hintBtn.addEventListener('click', () => {
        if (gameOver) return;

        ensureTimerStarted();

        if (hintUsed) {
          messageEl.textContent = 'Ya usaste la pista en este nivel.';
          messageEl.className = 'message';
          return;
        }

        hintUsed = true;
        hintEl.textContent = `Pista: ${currentLevel().hint}`;

        const isLost = consumeAttemptAndCheckLose('te quedaste sin intentos por usar pista');
        if (!isLost) {
          messageEl.textContent = 'Pista usada: -1 intento.';
          messageEl.className = 'message';
        }
      });

      restartBtn.addEventListener('click', () => {
        startLevel();
        ensureTimerStarted();
      });

      nextBtn.addEventListener('click', () => {
        if (levelIndex < MAX_LEVELS - 1) {
          levelIndex += 1;
          startLevel();
          ensureTimerStarted();
        }
      });

      startLevel();
    </script>
  </body>
</html>
