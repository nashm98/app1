<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f1f;
        --panel: #121a2b;
        --panel-2: #1b2640;
        --text: #f8fbff;
        --accent: #22d3ee;
        --good: #34d399;
        --bad: #fb7185;
        --muted: #9fb2d1;
        --logo: #f8fbff;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f9ff;
        --panel: #ffffff;
        --panel-2: #eef3ff;
        --text: #101828;
        --accent: #2563eb;
        --good: #059669;
        --bad: #dc2626;
        --muted: #475467;
        --logo: #111827;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1d4ed8 0%, #0b1226 38%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .game {
        width: min(900px, 100%);
        background: linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.35), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent) inset;
        padding: 20px;
      }

      :root[data-theme='light'] body {
        background: radial-gradient(circle at 20% 0%, #dbeafe 0%, #eef2ff 45%, var(--bg) 100%);
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
      }


      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .header-row h1 {
        margin: 0;
      }

      #app-logo {
        height: 68px;
        width: auto;
        filter: drop-shadow(0 2px 10px rgb(0 0 0 / 0.35));
      }


      .top-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lang-switch {
        display: flex;
        gap: 6px;
      }

      .lang-btn {
        padding: 6px 8px;
        font-size: 0.9rem;
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 82%, #000 18%);
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        color: var(--text);
      }

      .theme-btn {
        padding: 6px 10px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 82%, #000 18%);
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        color: var(--text);
      }

      .lang-btn.active {
        outline: 2px solid var(--accent);
      }

      .status {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .card {
        background: color-mix(in srgb, var(--panel) 88%, #000 12%);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }

      .card strong {
        display: block;
        font-size: 1.15rem;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .word {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 20px;
      }

      .letter {
        width: 40px;
        height: 50px;
        border-bottom: 3px solid var(--accent);
        box-shadow: 0 6px 20px rgb(34 211 238 / 0.12);
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .guess-panel,
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }

      .guess-panel {
        margin-bottom: 8px;
      }

      input {
        text-align: center;
        font-size: 1.05rem;
        text-transform: uppercase;
        border-radius: 10px;
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        padding: 8px 10px;
        background: color-mix(in srgb, var(--panel) 86%, #000 14%);
        color: var(--text);
      }

      #guess-input {
        width: min(260px, 70vw);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, filter 160ms ease;
      }

      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .guess-btn {
        background: linear-gradient(135deg, var(--accent) 0%, #06b6d4 100%);
        color: #04131d;
      }

      .restart-btn {
        background: linear-gradient(135deg, #334155 0%, #1f2937 100%);
        color: var(--text);
      }

      .hint-btn {
        background: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        color: #1a0e00;
      }

      .history,
      .hint {
        margin-top: 12px;
        text-align: center;
      }

      .hint {
        color: color-mix(in srgb, #fcd34d 82%, var(--text) 18%);
        min-height: 1.4em;
      }

      .message {
        margin-top: 10px;
        text-align: center;
        min-height: 1.4em;
        font-weight: 600;
      }

      .win { color: var(--good); }
      .lose { color: var(--bad); }

      .modal {
        position: fixed;
        inset: 0;
        background: rgb(2 6 23 / 0.72);
        backdrop-filter: blur(3px);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 20;
      }

      .modal.hidden { display: none; }

      .modal-card {
        width: min(560px, 100%);
        background: linear-gradient(165deg, #10192e 0%, #1a2742 100%);
        border: 1px solid #35507e;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.6);
        padding: 20px;
        text-align: center;
      }

      .modal-card h2 { margin: 0 0 10px; }
      .modal-card p { margin: 0 0 16px; color: var(--muted); }
      @media (max-width: 760px) {
        .header-row {
          flex-direction: column;
          align-items: center;
        }

        .status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #guess-input { width: min(260px, 85vw); }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <div class="header-row">
        <img id="app-logo" alt="Memora" />
        <div class="top-controls">
          <button class="theme-btn" id="theme-btn" type="button" title="Alternar tema">🌙/☀️</button>
          <div class="lang-switch" aria-label="Idioma">
            <button type="button" class="lang-btn" data-lang="es" title="Español">🇪🇸 Español</button>
            <button type="button" class="lang-btn" data-lang="en" title="English">🇬🇧 English</button>
            <button type="button" class="lang-btn" data-lang="pt" title="Português">🇵🇹 Português</button>
          </div>
        </div>
      </div>
      <p class="meta" id="meta"></p>

      <section class="status">
        <div class="card"><span id="label-level">Nivel</span><strong id="level">1/20</strong></div>
        <div class="card"><span id="label-points">Puntos</span><strong id="points">0/3</strong></div>
        <div class="card"><span id="label-time">Tiempo</span><strong id="time">45</strong></div>
        <div class="card"><span id="label-attempts">Intentos</span><strong id="attempts">7</strong></div>
        <div class="card"><span id="label-errors">Errores</span><strong id="errors">0</strong></div>
        <div class="card"><span id="label-bonus">+Tiempo letra</span><strong id="bonus">+4s</strong></div>
      </section>

      <section class="word" id="word" aria-label="Palabra a adivinar"></section>

      <form class="guess-panel" id="guess-form">
        <input id="guess-input" type="text" autocomplete="off" required aria-label="Escribe una letra o palabra completa" placeholder="" />
        <button class="guess-btn" type="submit">▶</button>
      </form>

      <div class="actions">
        <button class="hint-btn" id="hint-btn" type="button">PISTA (-1)</button>
        <button class="restart-btn" id="restart-btn" type="button">Reiniciar nivel</button>
      </div>

      <p class="history"><span id="used-label">Letras usadas:</span> <span id="used">(ninguna)</span></p>
      <p class="hint" id="hint">Pista: (oculta)</p>
      <p class="message" id="message"></p>
    </main>

    <div class="modal hidden" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <button class="guess-btn" id="modal-action" type="button">Continuar</button>
      </div>
    </div>

    <script>
      const LEVELS = [
        { theme: 'vida diaria', bonus: 4, targetPoints: 3, words: [{ word: 'CASA', hint: 'Lugar donde vives.' }, { word: 'LLAVE', hint: 'Sirve para abrir puertas.' }, { word: 'MESA', hint: 'Mueble para comer o trabajar.' }] },
        { theme: 'animales', bonus: 4, targetPoints: 3, words: [{ word: 'PERRO', hint: 'Animal doméstico leal.' }, { word: 'GATO', hint: 'Felino doméstico.' }, { word: 'CONEJO', hint: 'Animal de orejas largas.' }] },
        { theme: 'ciudad', bonus: 4, targetPoints: 3, words: [{ word: 'PARQUE', hint: 'Espacio verde urbano.' }, { word: 'PLAZA', hint: 'Espacio público de reunión.' }, { word: 'CALLE', hint: 'Vía dentro de la ciudad.' }] },
        { theme: 'hogar', bonus: 4, targetPoints: 3, words: [{ word: 'VENTANA', hint: 'Abertura que deja entrar luz.' }, { word: 'COCINA', hint: 'Lugar donde preparas comida.' }, { word: 'SILLA', hint: 'Asiento con respaldo.' }] },
        { theme: 'objetos', bonus: 4, targetPoints: 3, words: [{ word: 'RELOJ', hint: 'Indica la hora.' }, { word: 'MOCHILA', hint: 'Sirve para cargar cosas.' }, { word: 'CUADERNO', hint: 'Se usa para escribir notas.' }] },
        { theme: 'movilidad', bonus: 4, targetPoints: 3, words: [{ word: 'BICICLETA', hint: 'Vehículo de dos ruedas.' }, { word: 'AUTOBUS', hint: 'Transporte público colectivo.' }, { word: 'METRO', hint: 'Tren urbano subterráneo.' }] },
        { theme: 'tiempo', bonus: 3, targetPoints: 3, words: [{ word: 'CALENDARIO', hint: 'Organiza días y meses.' }, { word: 'SEMANA', hint: 'Período de siete días.' }, { word: 'ESTACION', hint: 'División climática del año.' }] },
        { theme: 'naturaleza', bonus: 3, targetPoints: 3, words: [{ word: 'MURCIELAGO', hint: 'Mamífero que vuela de noche.' }, { word: 'BOSQUE', hint: 'Terreno poblado de árboles.' }, { word: 'MONTAÑA', hint: 'Elevación natural del terreno.' }] },
        { theme: 'geografía', bonus: 3, targetPoints: 3, words: [{ word: 'VOLCAN', hint: 'Montaña que puede expulsar lava.' }, { word: 'DESIERTO', hint: 'Zona árida con poca lluvia.' }, { word: 'OCEANO', hint: 'Gran masa de agua salada.' }] },
        { theme: 'salud', bonus: 3, targetPoints: 3, words: [{ word: 'HOSPITAL', hint: 'Centro de atención médica.' }, { word: 'VACUNA', hint: 'Previene enfermedades.' }, { word: 'TERAPIA', hint: 'Tratamiento para mejorar salud.' }] },
        { theme: 'ciencia', bonus: 3, targetPoints: 3, words: [{ word: 'ECLIPSE', hint: 'Alineación de cuerpos celestes.' }, { word: 'ATOMO', hint: 'Unidad básica de la materia.' }, { word: 'GALAXIA', hint: 'Conjunto enorme de estrellas.' }] },
        { theme: 'sociedad', bonus: 3, targetPoints: 3, words: [{ word: 'DEMOCRACIA', hint: 'Sistema político participativo.' }, { word: 'CIUDADANIA', hint: 'Condición de pertenencia a un Estado.' }, { word: 'DERECHOS', hint: 'Garantías de las personas.' }] },
        { theme: 'historia', bonus: 2, targetPoints: 3, words: [{ word: 'ARQUEOLOGIA', hint: 'Estudia culturas antiguas por restos.' }, { word: 'REVOLUCION', hint: 'Cambio profundo de un sistema.' }, { word: 'IMPERIO', hint: 'Organización política extensa histórica.' }] },
        { theme: 'ecología', bonus: 2, targetPoints: 3, words: [{ word: 'BIODIVERSIDAD', hint: 'Variedad de especies en un entorno.' }, { word: 'ECOSISTEMA', hint: 'Relación entre seres vivos y entorno.' }, { word: 'RECICLAJE', hint: 'Transformar residuos para reutilizar.' }] },
        { theme: 'matemática', bonus: 2, targetPoints: 3, words: [{ word: 'HIPOTENUSA', hint: 'Lado mayor del triángulo rectángulo.' }, { word: 'FRACCION', hint: 'Expresa partes de un todo.' }, { word: 'GEOMETRIA', hint: 'Rama que estudia formas y espacio.' }] },
        { theme: 'lengua', bonus: 2, targetPoints: 3, words: [{ word: 'METAFORA', hint: 'Figura literaria de comparación implícita.' }, { word: 'SINTAXIS', hint: 'Reglas para combinar palabras.' }, { word: 'SEMANTICA', hint: 'Estudio del significado.' }] },
        { theme: 'finanzas', bonus: 2, targetPoints: 3, words: [{ word: 'CRIPTOMONEDA', hint: 'Activo digital con criptografía.' }, { word: 'INVERSION', hint: 'Colocar dinero para obtener ganancia.' }, { word: 'AHORRO', hint: 'Parte del ingreso que no se gasta.' }] },
        { theme: 'biología', bonus: 2, targetPoints: 3, words: [{ word: 'NEUROPLASTICIDAD', hint: 'Capacidad del cerebro para adaptarse.' }, { word: 'MITOCONDRIA', hint: 'Organelo que produce energía celular.' }, { word: 'GENETICA', hint: 'Estudia herencia biológica.' }] },
        { theme: 'física', bonus: 2, targetPoints: 3, words: [{ word: 'TERMODINAMICA', hint: 'Estudia calor y energía.' }, { word: 'GRAVEDAD', hint: 'Fuerza de atracción entre masas.' }, { word: 'INERCIA', hint: 'Tendencia a mantener estado de movimiento.' }] },
        { theme: 'educación', bonus: 2, targetPoints: 3, words: [{ word: 'INTERDISCIPLINARIO', hint: 'Integra varias áreas de conocimiento.' }, { word: 'PEDAGOGIA', hint: 'Disciplina sobre enseñanza.' }, { word: 'CURRICULO', hint: 'Plan de estudios estructurado.' }] },
      ];

      const I18N = {
        es: { level: 'Nivel', points: 'Puntos', time: 'Tiempo', attempts: 'Intentos', errors: 'Errores', bonus: '+Tiempo letra', used: 'Letras usadas:', none: '(ninguna)',
          hintBtn: 'PISTA (-1)', restart: 'Reiniciar nivel', hintPrefix: 'Pista', result: 'Resultado disponible en la ventana emergente.', tryAgain: 'Inténtalo de nuevo', restartModal: 'Comenzar de nuevo', done: 'Juego completado', back1: 'Volver al nivel 1', levelDone: 'Nivel superado', nextLevel: 'Siguiente nivel', wordDone: 'Palabra acertada', nextWord: 'Siguiente palabra', noAttempts: 'Sin intentos', timeOver: 'Se acabó el tiempo', loading: 'Cargando...', theme: 'Tema', difficulty: 'Dificultad', hidden: '(oculta)', enterLetter: 'Para letra, ingresa exactamente 1 carácter.', usedLetter: 'Esa letra ya fue usada.', correctLetter: '¡Correcta! Ganaste +{bonus}s.', wrongLetter: 'Letra incorrecta: -1 intento.', invalidWord: 'Ingresa una palabra válida (solo letras).', wrongWord: 'Palabra incorrecta: -1 intento.', invalidInput: 'Ingresa una letra o palabra válida.', hintUsed: 'Pista usada: -1 intento.', hintAlready: 'Ya usaste la pista en esta palabra.', themeToggle: 'Modo día/noche' },
        en: { level: 'Level', points: 'Points', time: 'Time', attempts: 'Attempts', errors: 'Errors', bonus: '+Time/letter', used: 'Used letters:', none: '(none)',
          hintBtn: 'HINT (-1)', restart: 'Restart level', hintPrefix: 'Hint', result: 'Result available in popup.', tryAgain: 'Try again', restartModal: 'Start again', done: 'Game completed', back1: 'Back to level 1', levelDone: 'Level completed', nextLevel: 'Next level', wordDone: 'Word solved', nextWord: 'Next word', noAttempts: 'No attempts left', timeOver: 'Time is over', loading: 'Loading...', theme: 'Theme', difficulty: 'Difficulty', hidden: '(hidden)', enterLetter: 'For a letter, enter exactly 1 character.', usedLetter: 'That letter was already used.', correctLetter: 'Correct! You gained +{bonus}s.', wrongLetter: 'Wrong letter: -1 attempt.', invalidWord: 'Enter a valid word (letters only).', wrongWord: 'Wrong word: -1 attempt.', invalidInput: 'Enter a valid letter or word.', hintUsed: 'Hint used: -1 attempt.', hintAlready: 'Hint already used for this word.', themeToggle: 'Light/Dark mode' },
        pt: { level: 'Nível', points: 'Pontos', time: 'Tempo', attempts: 'Tentativas', errors: 'Erros', bonus: '+Tempo/letra', used: 'Letras usadas:', none: '(nenhuma)',
          hintBtn: 'DICA (-1)', restart: 'Reiniciar nível', hintPrefix: 'Dica', result: 'Resultado disponível no popup.', tryAgain: 'Tente novamente', restartModal: 'Começar de novo', done: 'Jogo concluído', back1: 'Voltar ao nível 1', levelDone: 'Nível superado', nextLevel: 'Próximo nível', wordDone: 'Palavra acertada', nextWord: 'Próxima palavra', noAttempts: 'Sem tentativas', timeOver: 'O tempo acabou', loading: 'Carregando...', theme: 'Tema', difficulty: 'Dificuldade', hidden: '(oculta)', enterLetter: 'Para letra, digite exatamente 1 caractere.', usedLetter: 'Essa letra já foi usada.', correctLetter: 'Correta! Você ganhou +{bonus}s.', wrongLetter: 'Letra incorreta: -1 tentativa.', invalidWord: 'Digite uma palavra válida (somente letras).', wrongWord: 'Palavra incorreta: -1 tentativa.', invalidInput: 'Digite uma letra ou palavra válida.', hintUsed: 'Dica usada: -1 tentativa.', hintAlready: 'Você já usou a dica nesta palavra.', themeToggle: 'Modo claro/escuro' },
      };

      const ONLINE_MODE = true;
      const RANDOM_WORD_ENDPOINTS = ['https://random-word-api.herokuapp.com/word?number=1', 'https://random-word-api.vercel.app/api?words=1'];
      const MAX_LEVELS = LEVELS.length;
      const POINTS_PER_WORD = 1;

      const labelLevelEl = document.getElementById('label-level');
      const labelPointsEl = document.getElementById('label-points');
      const labelTimeEl = document.getElementById('label-time');
      const labelAttemptsEl = document.getElementById('label-attempts');
      const labelErrorsEl = document.getElementById('label-errors');
      const labelBonusEl = document.getElementById('label-bonus');
      const usedLabelEl = document.getElementById('used-label');
      const langButtons = document.querySelectorAll('.lang-btn');
      const themeBtn = document.getElementById('theme-btn');

      const wordEl = document.getElementById('word');
      const timeEl = document.getElementById('time');
      const attemptsEl = document.getElementById('attempts');
      const errorsEl = document.getElementById('errors');
      const usedEl = document.getElementById('used');
      const messageEl = document.getElementById('message');
      const hintEl = document.getElementById('hint');
      const levelEl = document.getElementById('level');
      const pointsEl = document.getElementById('points');
      const metaEl = document.getElementById('meta');
      const bonusEl = document.getElementById('bonus');
      const guessForm = document.getElementById('guess-form');
      const guessInput = document.getElementById('guess-input');
      const hintBtn = document.getElementById('hint-btn');
      const restartBtn = document.getElementById('restart-btn');
      const modalEl = document.getElementById('result-modal');
      const modalTitleEl = document.getElementById('modal-title');
      const modalTextEl = document.getElementById('modal-text');
      const modalActionBtn = document.getElementById('modal-action');
      const appLogoEl = document.getElementById('app-logo');

      let currentLang = 'es';
      let currentTheme = 'dark';
      let levelIndex = 0;
      let levelPoints = 0;
      let secretWord = '';
      let currentHint = '';
      let guessedLetters = new Set();
      let wrongLetters = new Set();
      let attemptsLeft = 8;
      let timeLeft = 55;
      let timerId;
      let timerStarted = false;
      let gameOver = false;
      let hintUsed = false;

      const usedWordsCache = new Set();
      const definitionCache = new Map();
      const translationCache = new Map();

      const t = (key, vars = {}) => {
        let text = (I18N[currentLang] && I18N[currentLang][key]) || I18N.es[key] || key;
        Object.entries(vars).forEach(([k, v]) => { text = text.replaceAll(`{${k}}`, String(v)); });
        return text;
      };

      function renderLogo() {
        const logoColor = getComputedStyle(document.documentElement).getPropertyValue('--logo').trim() || '#fff';
        const logoSvg = `<svg xmlns='http://www.w3.org/2000/svg' width='560' height='120' viewBox='0 0 560 120'>
          <rect width='560' height='120' fill='none'/>
          <g fill='none' stroke='${logoColor}' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'>
            <path d='M24 102h130'/><path d='M54 102v-60h62'/><path d='M85 42l-31 31'/><circle cx='122' cy='25' r='18'/>
            <path d='M122 43v14'/><circle cx='122' cy='66' r='8'/><path d='M122 74v20'/><path d='M110 94c0-8 6-14 12-14s12 6 12 14'/>
          </g>
          <text x='176' y='84' font-size='78' font-family='Arial, Helvetica, sans-serif' font-weight='700' fill='${logoColor}'>Memora</text>
        </svg>`;
        appLogoEl.src = `data:image/svg+xml;utf8,${encodeURIComponent(logoSvg)}`;
      }

      function setTheme(theme) {
        currentTheme = theme === 'light' ? 'light' : 'dark';
        if (currentTheme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        else document.documentElement.removeAttribute('data-theme');
        renderLogo();
      }

      function applyLanguage() {
        document.documentElement.lang = currentLang;
        labelLevelEl.textContent = t('level');
        labelPointsEl.textContent = t('points');
        labelTimeEl.textContent = t('time');
        labelAttemptsEl.textContent = t('attempts');
        labelErrorsEl.textContent = t('errors');
        labelBonusEl.textContent = t('bonus');
        usedLabelEl.textContent = t('used');
        hintBtn.textContent = t('hintBtn');
        restartBtn.textContent = t('restart');
        themeBtn.title = t('themeToggle');
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        hintEl.textContent = `${t('hintPrefix')}: ${hintUsed ? currentHint : t('hidden')}`;
        if (!wrongLetters.size) usedEl.textContent = t('none');
        langButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.lang === currentLang));
      }

      function currentLevel() { return LEVELS[levelIndex]; }
      function levelAttempts(index) { if (index < 6) return 8; if (index < 12) return 7; if (index < 17) return 6; return 5; }
      function levelTime(index) { if (index < 6) return 55; if (index < 12) return 50; if (index < 17) return 45; return 40; }
      function normalizeText(value) { return value.normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim(); }
      function sanitizeWord(rawWord) { return normalizeText(rawWord).replace(/[^A-ZÑ]/g, ''); }

      async function fetchJsonWithTimeout(url, timeoutMs = 3000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) return null;
          return await res.json();
        } catch { return null; } finally { clearTimeout(timer); }
      }

      async function translateText(text, targetLang, sourceLang = 'auto') {
        if (!text || targetLang === sourceLang) return text;
        const key = `${sourceLang}|${targetLang}|${text}`;
        if (translationCache.has(key)) return translationCache.get(key);
        const data = await fetchJsonWithTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        let translated = text;
        if (Array.isArray(data) && Array.isArray(data[0])) {
          const built = data[0].map((part) => part[0]).join('').trim();
          if (built) translated = built;
        }
        translationCache.set(key, translated);
        return translated;
      }

      async function localizeWordEntry(entry) {
        if (currentLang === 'es') return { word: sanitizeWord(entry.word), hint: entry.hint, theme: currentLevel().theme };
        const translatedWord = sanitizeWord(await translateText(entry.word.toLowerCase(), currentLang, 'es'));
        const translatedHint = await translateText(entry.hint, currentLang, 'es');
        const translatedTheme = await translateText(currentLevel().theme, currentLang, 'es');
        return { word: translatedWord || sanitizeWord(entry.word), hint: translatedHint, theme: translatedTheme };
      }

      async function fetchOnlineDefinitionEn(word) {
        const lower = word.toLowerCase();
        if (definitionCache.has(lower)) return definitionCache.get(lower);
        const data = await fetchJsonWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lower)}`);
        let definition = `Word related to ${currentLevel().theme}.`;
        if (Array.isArray(data) && data[0]?.meanings?.length) {
          const firstDef = data[0].meanings[0]?.definitions?.[0]?.definition;
          if (firstDef) definition = firstDef;
        }
        definitionCache.set(lower, definition);
        return definition;
      }

      async function fetchOnlineWordEntry() {
        for (let i = 0; i < 8; i += 1) {
          const endpoint = RANDOM_WORD_ENDPOINTS[i % RANDOM_WORD_ENDPOINTS.length];
          const data = await fetchJsonWithTimeout(endpoint);
          const baseWord = Array.isArray(data) ? sanitizeWord(data[0] || '') : '';
          if (!baseWord || baseWord.length < 4 || usedWordsCache.has(`${currentLang}:${baseWord}`)) continue;
          const definitionEn = await fetchOnlineDefinitionEn(baseWord);
          const localizedWord = currentLang === 'en' ? baseWord : sanitizeWord(await translateText(baseWord.toLowerCase(), currentLang, 'en'));
          const localizedHint = currentLang === 'en' ? definitionEn : await translateText(definitionEn, currentLang, 'en');
          if (!localizedWord || localizedWord.length < 3) continue;
          return { word: localizedWord, hint: localizedHint, theme: await translateText(currentLevel().theme, currentLang, 'es') };
        }
        return null;
      }

      async function pickOfflineWordEntry() {
        const words = currentLevel().words;
        const pool = words.filter((entry) => !usedWordsCache.has(`${currentLang}:${sanitizeWord(entry.word)}`));
        const entry = (pool.length ? pool : words)[Math.floor(Math.random() * (pool.length ? pool.length : words.length))];
        return localizeWordEntry(entry);
      }

      async function pickWordEntry() {
        if (ONLINE_MODE) {
          const online = await fetchOnlineWordEntry();
          if (online) return online;
        }
        return pickOfflineWordEntry();
      }

      function renderWord() {
        wordEl.innerHTML = '';
        [...secretWord].forEach((letter) => {
          const el = document.createElement('div');
          el.className = 'letter';
          el.textContent = guessedLetters.has(letter) ? letter : '';
          wordEl.appendChild(el);
        });
      }

      let currentThemeLabel = currentLevel().theme;
      function updateStatus() {
        levelEl.textContent = `${levelIndex + 1}/${MAX_LEVELS}`;
        pointsEl.textContent = `${levelPoints}/${currentLevel().targetPoints}`;
        timeEl.textContent = String(timeLeft);
        attemptsEl.textContent = String(attemptsLeft);
        errorsEl.textContent = String(wrongLetters.size);
        usedEl.textContent = wrongLetters.size ? [...wrongLetters].join(', ') : t('none');
        bonusEl.textContent = `+${currentLevel().bonus}s`;
        metaEl.textContent = `${t('theme')}: ${currentThemeLabel} · ${t('difficulty')} ${levelIndex + 1}`;
      }

      function allLettersGuessed() { return [...secretWord].every((l) => guessedLetters.has(l)); }
      function revealWord() { [...secretWord].forEach((l) => guessedLetters.add(l)); renderWord(); }

      function openResultModal({ win, title, actionText, onAction, reason = '' }) {
        modalEl.classList.remove('hidden');
        modalTitleEl.textContent = title;
        modalTextEl.textContent = `${t('hintPrefix')}: ${currentHint}${reason ? ` · ${reason}` : ''}`;
        modalActionBtn.textContent = actionText;
        modalActionBtn.onclick = () => { modalEl.classList.add('hidden'); onAction(); };
        messageEl.textContent = t('result');
        messageEl.className = win ? 'message win' : 'message lose';
      }

      function finishLoss(reason = '') {
        gameOver = true;
        clearInterval(timerId);
        revealWord();
        openResultModal({ win: false, title: t('tryAgain'), actionText: t('restartModal'), reason, onAction: () => startLevel() });
      }

      function finishWordSolved() {
        gameOver = true;
        clearInterval(timerId);
        levelPoints += POINTS_PER_WORD;
        updateStatus();
        if (levelPoints >= currentLevel().targetPoints) {
          if (levelIndex === MAX_LEVELS - 1) {
            openResultModal({ win: true, title: t('done'), actionText: t('back1'), onAction: () => { levelIndex = 0; startLevel(); } });
            return;
          }
          openResultModal({ win: true, title: t('levelDone'), actionText: t('nextLevel'), onAction: () => { levelIndex += 1; startLevel(); } });
          return;
        }
        openResultModal({ win: true, title: t('wordDone'), actionText: t('nextWord'), onAction: () => startRound() });
      }

      function consumeAttemptAndCheckLose(reason) {
        attemptsLeft -= 1;
        updateStatus();
        if (attemptsLeft <= 0) { finishLoss(reason); return true; }
        return false;
      }

      function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (gameOver) return clearInterval(timerId);
          timeLeft -= 1;
          updateStatus();
          if (timeLeft <= 0) finishLoss(t('timeOver'));
        }, 1000);
      }

      function ensureTimerStarted() {
        if (!timerStarted && !gameOver) { timerStarted = true; startTimer(); }
      }

      async function startRound() {
        gameOver = true;
        hintEl.textContent = `${t('hintPrefix')}: ${t('hidden')}`;
        messageEl.textContent = t('loading');
        messageEl.className = 'message';
        modalEl.classList.add('hidden');

        const entry = await pickWordEntry();
        secretWord = entry.word;
        currentHint = entry.hint;
        currentThemeLabel = entry.theme || currentLevel().theme;
        usedWordsCache.add(`${currentLang}:${secretWord}`);

        guessedLetters = new Set();
        wrongLetters = new Set();
        attemptsLeft = levelAttempts(levelIndex);
        timeLeft = levelTime(levelIndex);
        gameOver = false;
        timerStarted = false;
        hintUsed = false;

        messageEl.textContent = '';
        messageEl.className = 'message';
        renderWord();
        updateStatus();
        guessInput.value = '';
        guessInput.focus();
      }

      function startLevel() { levelPoints = 0; startRound(); }

      function handleLetterGuess(rawValue) {
        ensureTimerStarted();
        const guess = normalizeText(rawValue);
        if (!/^[A-ZÑ]$/.test(guess)) { messageEl.textContent = t('enterLetter'); messageEl.className = 'message lose'; return; }
        if (guessedLetters.has(guess) || wrongLetters.has(guess)) { messageEl.textContent = t('usedLetter'); messageEl.className = 'message'; return; }
        if (secretWord.includes(guess)) {
          guessedLetters.add(guess);
          timeLeft += currentLevel().bonus;
          renderWord();
          updateStatus();
          if (allLettersGuessed()) finishWordSolved();
          else { messageEl.textContent = t('correctLetter', { bonus: currentLevel().bonus }); messageEl.className = 'message win'; }
          return;
        }
        wrongLetters.add(guess);
        updateStatus();
        if (!consumeAttemptAndCheckLose(t('noAttempts'))) { messageEl.textContent = t('wrongLetter'); messageEl.className = 'message lose'; }
      }

      function handleWordGuess(rawValue) {
        ensureTimerStarted();
        const guessWord = normalizeText(rawValue);
        if (!guessWord || !/^[A-ZÑ]+$/.test(guessWord)) { messageEl.textContent = t('invalidWord'); messageEl.className = 'message lose'; return; }
        if (guessWord === secretWord) { revealWord(); updateStatus(); finishWordSolved(); return; }
        if (!consumeAttemptAndCheckLose(t('noAttempts'))) { messageEl.textContent = t('wrongWord'); messageEl.className = 'message lose'; }
      }

      guessForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (gameOver) return;
        const value = guessInput.value;
        guessInput.value = '';
        guessInput.focus();
        const normalized = normalizeText(value);
        if (!normalized) { messageEl.textContent = t('invalidInput'); messageEl.className = 'message lose'; return; }
        if (normalized.length === 1) handleLetterGuess(normalized); else handleWordGuess(normalized);
      });

      hintBtn.addEventListener('click', () => {
        if (gameOver) return;
        ensureTimerStarted();
        if (hintUsed) { messageEl.textContent = t('hintAlready'); messageEl.className = 'message'; return; }
        hintUsed = true;
        hintEl.textContent = `${t('hintPrefix')}: ${currentHint}`;
        if (!consumeAttemptAndCheckLose(t('noAttempts'))) { messageEl.textContent = t('hintUsed'); messageEl.className = 'message'; }
      });

      restartBtn.addEventListener('click', () => { startLevel(); ensureTimerStarted(); });

      themeBtn.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        applyLanguage();
      });

      langButtons.forEach((btn) => {
        btn.addEventListener('click', async () => {
          currentLang = btn.dataset.lang || 'es';
          usedWordsCache.clear();
          applyLanguage();
          await startRound();
        });
      });

      setTheme('dark');
      applyLanguage();
      startLevel();
    </script>
  </body>
</html>
