<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adivina la palabra</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #e2e8f0;
        --accent: #38bdf8;
        --good: #22c55e;
        --bad: #ef4444;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at top, #1d4ed8, var(--bg));
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .game {
        width: min(720px, 100%);
        background: color-mix(in srgb, var(--panel) 88%, black);
        border: 1px solid #334155;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgb(0 0 0 / 0.45);
        padding: 20px;
      }

      h1 {
        margin-top: 0;
        text-align: center;
      }

      .status {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }

      .card {
        background: #0f172a;
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }

      .card strong {
        display: block;
        font-size: 1.45rem;
      }

      .word {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 16px 0 22px;
      }

      .letter {
        width: 40px;
        height: 50px;
        border-bottom: 3px solid var(--accent);
        display: grid;
        place-items: center;
        font-size: 1.7rem;
        font-weight: 700;
      }

      form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
      }

      input {
        width: 64px;
        text-align: center;
        font-size: 1.3rem;
        text-transform: uppercase;
        border-radius: 10px;
        border: 1px solid #475569;
        padding: 8px 10px;
        background: #0b1220;
        color: var(--text);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      .guess-btn {
        background: var(--accent);
        color: #062033;
      }

      .restart-btn {
        background: #475569;
        color: var(--text);
      }

      .history {
        margin-top: 15px;
        text-align: center;
      }

      .message {
        margin-top: 12px;
        text-align: center;
        min-height: 1.4em;
        font-weight: 600;
      }

      .win {
        color: var(--good);
      }

      .lose {
        color: var(--bad);
      }
    </style>
  </head>
  <body>
    <main class="game">
      <h1>Adivina la palabra ⏳</h1>

      <section class="status">
        <div class="card">
          Tiempo
          <strong id="time">45</strong>
        </div>
        <div class="card">
          Intentos
          <strong id="attempts">7</strong>
        </div>
        <div class="card">
          Errores
          <strong id="errors">0</strong>
        </div>
      </section>

      <section class="word" id="word" aria-label="Palabra a adivinar"></section>

      <form id="guess-form">
        <input id="guess-input" type="text" maxlength="1" autocomplete="off" required aria-label="Escribe una letra" />
        <button class="guess-btn" type="submit">Probar letra</button>
        <button class="restart-btn" id="restart-btn" type="button">Nueva partida</button>
      </form>

      <p class="history">Letras usadas: <span id="used">(ninguna)</span></p>
      <p class="message" id="message"></p>
    </main>

    <script>
      const WORDS = [
        'javascript',
        'programacion',
        'algoritmo',
        'internet',
        'tecnologia',
        'frontend',
        'desarrollo',
        'computadora',
      ];

      const MAX_ATTEMPTS = 7;
      const START_TIME = 45;

      const wordEl = document.getElementById('word');
      const timeEl = document.getElementById('time');
      const attemptsEl = document.getElementById('attempts');
      const errorsEl = document.getElementById('errors');
      const usedEl = document.getElementById('used');
      const messageEl = document.getElementById('message');
      const form = document.getElementById('guess-form');
      const input = document.getElementById('guess-input');
      const restartBtn = document.getElementById('restart-btn');

      let secretWord = '';
      let guessedLetters = new Set();
      let wrongLetters = new Set();
      let attemptsLeft = MAX_ATTEMPTS;
      let timeLeft = START_TIME;
      let timerId;
      let gameOver = false;

      function pickWord() {
        return WORDS[Math.floor(Math.random() * WORDS.length)].toUpperCase();
      }

      function renderWord() {
        wordEl.innerHTML = '';
        for (const letter of secretWord) {
          const div = document.createElement('div');
          div.className = 'letter';
          div.textContent = guessedLetters.has(letter) ? letter : '';
          wordEl.appendChild(div);
        }
      }

      function updateStatus() {
        timeEl.textContent = String(timeLeft);
        attemptsEl.textContent = String(attemptsLeft);
        errorsEl.textContent = String(wrongLetters.size);
        usedEl.textContent = wrongLetters.size ? [...wrongLetters].join(', ') : '(ninguna)';
      }

      function allLettersGuessed() {
        return [...secretWord].every((letter) => guessedLetters.has(letter));
      }

      function finishGame(win, reason = '') {
        gameOver = true;
        clearInterval(timerId);

        if (win) {
          messageEl.textContent = '¡Ganaste! Adivinaste la palabra.';
          messageEl.className = 'message win';
          return;
        }

        messageEl.textContent = `Perdiste${reason ? ` (${reason})` : ''}. La palabra era ${secretWord}.`;
        messageEl.className = 'message lose';

        for (const letter of secretWord) {
          guessedLetters.add(letter);
        }
        renderWord();
      }

      function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (gameOver) {
            clearInterval(timerId);
            return;
          }

          timeLeft -= 1;
          updateStatus();

          if (timeLeft <= 0) {
            finishGame(false, 'se acabó el tiempo');
          }
        }, 1000);
      }

      function startGame() {
        secretWord = pickWord();
        guessedLetters = new Set();
        wrongLetters = new Set();
        attemptsLeft = MAX_ATTEMPTS;
        timeLeft = START_TIME;
        gameOver = false;

        messageEl.textContent = 'Adivina la palabra antes de que termine el tiempo.';
        messageEl.className = 'message';

        renderWord();
        updateStatus();
        startTimer();
        input.value = '';
        input.focus();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (gameOver) {
          return;
        }

        const guess = input.value.trim().toUpperCase();
        input.value = '';
        input.focus();

        if (!/^[A-ZÑ]$/.test(guess)) {
          messageEl.textContent = 'Ingresa solo una letra.';
          messageEl.className = 'message lose';
          return;
        }

        if (guessedLetters.has(guess) || wrongLetters.has(guess)) {
          messageEl.textContent = 'Esa letra ya fue usada.';
          messageEl.className = 'message';
          return;
        }

        if (secretWord.includes(guess)) {
          guessedLetters.add(guess);
          renderWord();

          if (allLettersGuessed()) {
            finishGame(true);
          } else {
            messageEl.textContent = '¡Bien! Esa letra existe.';
            messageEl.className = 'message win';
          }
        } else {
          wrongLetters.add(guess);
          attemptsLeft -= 1;
          updateStatus();

          if (attemptsLeft <= 0) {
            finishGame(false, 'sin intentos');
          } else {
            messageEl.textContent = 'Esa letra no está en la palabra.';
            messageEl.className = 'message lose';
          }
        }
      });

      restartBtn.addEventListener('click', startGame);
      startGame();
    </script>
  </body>
</html>
