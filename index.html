<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0f1f;
        --panel: #121a2b;
        --panel-2: #1b2640;
        --text: #f8fbff;
        --accent: #22d3ee;
        --good: #34d399;
        --bad: #fb7185;
        --muted: #9fb2d1;
        --logo: #f8fbff;
        --btn-guess: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
        --btn-guess-text: #04131d;
        --btn-hint: linear-gradient(135deg, #f59e0b 0%, #fb7185 100%);
        --btn-hint-text: #1a0e00;
        --btn-restart: linear-gradient(135deg, #334155 0%, #1f2937 100%);
        --btn-restart-text: #f8fbff;
        --modal-overlay: rgb(2 6 23 / 0.72);
        --modal-bg: linear-gradient(165deg, #10192e 0%, #1a2742 100%);
        --modal-border: #35507e;
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f9ff;
        --panel: #ffffff;
        --panel-2: #eef3ff;
        --text: #101828;
        --accent: #2563eb;
        --good: #059669;
        --bad: #dc2626;
        --muted: #475467;
        --logo: #111827;
        --btn-guess: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
        --btn-guess-text: #ffffff;
        --btn-hint: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
        --btn-hint-text: #111827;
        --btn-restart: linear-gradient(135deg, #1f2937 0%, #111827 100%);
        --btn-restart-text: #ffffff;
        --modal-overlay: rgb(15 23 42 / 0.24);
        --modal-bg: linear-gradient(165deg, #ffffff 0%, #eef3ff 100%);
        --modal-border: #93c5fd;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 20% 0%, #1d4ed8 0%, #0b1226 38%, var(--bg) 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
      }

      .game {
        width: min(900px, 100%);
        background: linear-gradient(165deg, var(--panel) 0%, var(--panel-2) 100%);
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgb(0 0 0 / 0.35), 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent) inset;
        padding: 20px;
      }

      :root[data-theme='light'] body {
        background: radial-gradient(circle at 20% 0%, #dbeafe 0%, #eef2ff 45%, var(--bg) 100%);
      }

      h1 {
        margin: 0 0 14px;
        text-align: center;
      }


      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .header-row h1 {
        margin: 0;
      }

      #app-logo {
        height: 68px;
        width: auto;
        filter: drop-shadow(0 2px 10px rgb(0 0 0 / 0.35));
      }


      .top-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .lang-switch {
        display: flex;
        gap: 6px;
      }

      .lang-btn {
        padding: 6px 8px;
        font-size: 0.9rem;
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 82%, #000 18%);
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        color: var(--text);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .flag-icon {
        width: 18px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgb(0 0 0 / 0.25);
        display: inline-block;
        background-size: cover;
        background-position: center;
        flex: 0 0 auto;
      }

      .flag-es { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 24'><rect width='36' height='24' fill='%23c60b1e'/><rect y='6' width='36' height='12' fill='%23ffc400'/></svg>"); }
      .flag-en { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 24'><rect width='36' height='24' fill='%23012169'/><path d='M0 0L36 24M36 0L0 24' stroke='%23fff' stroke-width='5'/><path d='M0 0L36 24M36 0L0 24' stroke='%23c8102e' stroke-width='3'/><rect x='14' width='8' height='24' fill='%23fff'/><rect y='8' width='36' height='8' fill='%23fff'/><rect x='15.5' width='5' height='24' fill='%23c8102e'/><rect y='9.5' width='36' height='5' fill='%23c8102e'/></svg>"); }
      .flag-pt { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 24'><rect width='14' height='24' fill='%2300602f'/><rect x='14' width='22' height='24' fill='%23da291c'/><circle cx='14' cy='12' r='4' fill='%23ffcc00'/></svg>"); }

      .theme-btn {
        padding: 6px 10px;
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 82%, #000 18%);
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        color: var(--text);
      }

      .lang-btn.active {
        outline: 2px solid var(--accent);
      }

      .status {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .card {
        background: color-mix(in srgb, var(--panel) 88%, #000 12%);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
      }

      .card strong {
        display: block;
        font-size: 1.15rem;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .word {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0 20px;
      }

      .letter {
        width: 40px;
        height: 50px;
        border-bottom: 3px solid var(--accent);
        box-shadow: 0 6px 20px rgb(34 211 238 / 0.12);
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 700;
      }

      .guess-panel,
      .actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
      }

      .guess-panel {
        margin-bottom: 8px;
      }

      input {
        text-align: center;
        font-size: 1.05rem;
        text-transform: uppercase;
        border-radius: 10px;
        border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
        padding: 8px 10px;
        background: color-mix(in srgb, var(--panel) 86%, #000 14%);
        color: var(--text);
      }

      #guess-input {
        width: min(260px, 70vw);
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, filter 160ms ease;
      }

      button:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
      }

      .guess-btn {
        background: var(--btn-guess);
        color: var(--btn-guess-text);
      }

      .restart-btn {
        background: var(--btn-restart);
        color: var(--btn-restart-text);
      }

      .hint-btn {
        background: var(--btn-hint);
        color: var(--btn-hint-text);
      }

      .history,
      .hint {
        margin-top: 12px;
        text-align: center;
      }

      .hint {
        color: color-mix(in srgb, #fcd34d 82%, var(--text) 18%);
        min-height: 1.4em;
      }

      .message {
        margin-top: 10px;
        text-align: center;
        min-height: 1.4em;
        font-weight: 600;
      }

      .win { color: var(--good); }
      .lose { color: var(--bad); }

      .modal {
        position: fixed;
        inset: 0;
        background: var(--modal-overlay);
        backdrop-filter: blur(3px);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 20;
      }

      .modal.hidden { display: none; }

      .modal-card {
        width: min(560px, 100%);
        background: var(--modal-bg);
        border: 1px solid var(--modal-border);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.6);
        padding: 20px;
        text-align: center;
      }

      .modal-card h2 { margin: 0 0 10px; }
      .modal-card p { margin: 0 0 16px; color: var(--muted); }
      @media (max-width: 760px) {
        .header-row {
          flex-direction: column;
          align-items: center;
        }

        .status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #guess-input { width: min(260px, 85vw); }
      }
    </style>
  </head>
  <body>
    <main class="game">
      <div class="header-row">
        <img id="app-logo" alt="Memora" />
        <div class="top-controls">
          <button class="theme-btn" id="theme-btn" type="button" title="Alternar tema">🌙/☀️</button>
          <div class="lang-switch" aria-label="Idioma">
            <button type="button" class="lang-btn" data-lang="es" title="Español"><span class="flag-icon flag-es" aria-hidden="true"></span><span>Español</span></button>
            <button type="button" class="lang-btn" data-lang="en" title="English"><span class="flag-icon flag-en" aria-hidden="true"></span><span>English</span></button>
            <button type="button" class="lang-btn" data-lang="pt" title="Português"><span class="flag-icon flag-pt" aria-hidden="true"></span><span>Português</span></button>
          </div>
        </div>
      </div>
      <p class="meta" id="meta"></p>

      <section class="status">
        <div class="card"><span id="label-level">Nivel</span><strong id="level">1/20</strong></div>
        <div class="card"><span id="label-points">Puntos</span><strong id="points">0/3</strong></div>
        <div class="card"><span id="label-time">Tiempo</span><strong id="time">45</strong></div>
        <div class="card"><span id="label-attempts">Intentos</span><strong id="attempts">7</strong></div>
        <div class="card"><span id="label-errors">Errores</span><strong id="errors">0</strong></div>
        <div class="card"><span id="label-bonus">+Tiempo letra</span><strong id="bonus">+4s</strong></div>
      </section>

      <section class="word" id="word" aria-label="Palabra a adivinar"></section>

      <form class="guess-panel" id="guess-form">
        <input id="guess-input" type="text" autocomplete="off" required aria-label="Escribe una letra o palabra completa" placeholder="" />
        <button class="guess-btn" type="submit">▶</button>
      </form>

      <div class="actions">
        <button class="hint-btn" id="hint-btn" type="button">PISTA (-1)</button>
        <button class="restart-btn" id="restart-btn" type="button">Reiniciar nivel</button>
      </div>

      <p class="history"><span id="used-label">Letras usadas:</span> <span id="used">(ninguna)</span></p>
      <p class="hint" id="hint">Pista: (oculta)</p>
      <p class="message" id="message"></p>
    </main>

    <div class="modal hidden" id="result-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <button class="guess-btn" id="modal-action" type="button">Continuar</button>
      </div>
    </div>

    <script>

        { theme: 'hogar', bonus: 4, targetPoints: 3, words: [{ word: 'CASA', hint: 'Lugar donde vives.' }, { word: 'MESA', hint: 'Mueble para comer o trabajar.' }, { word: 'SILLA', hint: 'Asiento con respaldo.' }] },

        IMPERIO: { en: 'EMPIRE', pt: 'IMPERIO' },
        REVOLUCION: { en: 'REVOLUTION', pt: 'REVOLUCAO' },
        ARQUEOLOGIA: { en: 'ARCHAEOLOGY', pt: 'ARQUEOLOGIA' },
        RECICLAJE: { en: 'RECYCLING', pt: 'RECICLAGEM' },
        ECOSISTEMA: { en: 'ECOSYSTEM', pt: 'ECOSSISTEMA' },
        BIODIVERSIDAD: { en: 'BIODIVERSITY', pt: 'BIODIVERSIDADE' },
        FRACCION: { en: 'FRACTION', pt: 'FRACAO' },
        GEOMETRIA: { en: 'GEOMETRY', pt: 'GEOMETRIA' },
        HIPOTENUSA: { en: 'HYPOTENUSE', pt: 'HIPOTENUSA' },
        SINTAXIS: { en: 'SYNTAX', pt: 'SINTAXE' },
        SEMANTICA: { en: 'SEMANTICS', pt: 'SEMANTICA' },
        METAFORA: { en: 'METAPHOR', pt: 'METAFORA' },
        AHORRO: { en: 'SAVINGS', pt: 'POUPANCA' },
        INVERSION: { en: 'INVESTMENT', pt: 'INVESTIMENTO' },
        CRIPTOMONEDA: { en: 'CRYPTOCURRENCY', pt: 'CRIPTOMOEDA' },
        GENETICA: { en: 'GENETICS', pt: 'GENETICA' },
        MITOCONDRIA: { en: 'MITOCHONDRIA', pt: 'MITOCONDRIA' },
        NEUROPLASTICIDAD: { en: 'NEUROPLASTICITY', pt: 'NEUROPLASTICIDADE' },
        INERCIA: { en: 'INERTIA', pt: 'INERCIA' },
        GRAVEDAD: { en: 'GRAVITY', pt: 'GRAVIDADE' },
        TERMODINAMICA: { en: 'THERMODYNAMICS', pt: 'TERMODINAMICA' },
        PEDAGOGIA: { en: 'PEDAGOGY', pt: 'PEDAGOGIA' },
        CURRICULO: { en: 'CURRICULUM', pt: 'CURRICULO' },
        INTERDISCIPLINARIO: { en: 'INTERDISCIPLINARY', pt: 'INTERDISCIPLINAR' },
      };

      const I18N = {
        es: { level: 'Nivel', points: 'Puntos', time: 'Tiempo', attempts: 'Intentos', errors: 'Errores', bonus: '+Tiempo letra', used: 'Letras usadas:', none: '(ninguna)',
          hintBtn: 'PISTA (-{cost})', restart: 'Reiniciar nivel', hintPrefix: 'Pista', result: 'Resultado disponible en la ventana emergente.', tryAgain: 'Inténtalo de nuevo', restartModal: 'Comenzar de nuevo', done: 'Juego completado', back1: 'Volver al nivel 1', levelDone: 'Nivel superado', nextLevel: 'Siguiente nivel', wordDone: 'Palabra acertada', nextWord: 'Siguiente palabra', noAttempts: 'Sin intentos', timeOver: 'Se acabó el tiempo', loading: 'Cargando...', theme: 'Tema', difficulty: 'Dificultad', hidden: '(oculta)', enterLetter: 'Para letra, ingresa exactamente 1 carácter.', usedLetter: 'Esa letra ya fue usada.', correctLetter: '¡Correcta! Ganaste +{bonus}s.', wrongLetter: 'Letra incorrecta: -1 intento.', invalidWord: 'Ingresa una palabra válida (solo letras).', wrongWord: 'Palabra incorrecta: -1 intento.', invalidInput: 'Ingresa una letra o palabra válida.', hintUsed: 'Pista aplicada: -{cost} puntos.', hintAlready: 'No hay más pistas para esta palabra.', hintNeedLetter: 'Acierta al menos 1 letra para pedir otra pista.', noPointsNeeded: 'No posees puntos necesarios.', hintL1: 'Tema: {theme}. La palabra tiene {length} letras.', hintL2: 'Empieza con "{first}" y termina con "{last}".', themeToggle: 'Modo día/noche' },
        en: { level: 'Level', points: 'Points', time: 'Time', attempts: 'Attempts', errors: 'Errors', bonus: '+Time/letter', used: 'Used letters:', none: '(none)',
          hintBtn: 'HINT (-{cost})', restart: 'Restart level', hintPrefix: 'Hint', result: 'Result available in popup.', tryAgain: 'Try again', restartModal: 'Start again', done: 'Game completed', back1: 'Back to level 1', levelDone: 'Level completed', nextLevel: 'Next level', wordDone: 'Word solved', nextWord: 'Next word', noAttempts: 'No attempts left', timeOver: 'Time is over', loading: 'Loading...', theme: 'Theme', difficulty: 'Difficulty', hidden: '(hidden)', enterLetter: 'For a letter, enter exactly 1 character.', usedLetter: 'That letter was already used.', correctLetter: 'Correct! You gained +{bonus}s.', wrongLetter: 'Wrong letter: -1 attempt.', invalidWord: 'Enter a valid word (letters only).', wrongWord: 'Wrong word: -1 attempt.', invalidInput: 'Enter a valid letter or word.', hintUsed: 'Hint applied: -{cost} points.', hintAlready: 'No more hints for this word.', hintNeedLetter: 'Guess at least 1 correct letter to request another hint.', noPointsNeeded: 'You do not have enough points.', hintL1: 'Theme: {theme}. The word has {length} letters.', hintL2: 'It starts with "{first}" and ends with "{last}".', themeToggle: 'Light/Dark mode' },
        pt: { level: 'Nível', points: 'Pontos', time: 'Tempo', attempts: 'Tentativas', errors: 'Erros', bonus: '+Tempo/letra', used: 'Letras usadas:', none: '(nenhuma)',
          hintBtn: 'DICA (-{cost})', restart: 'Reiniciar nível', hintPrefix: 'Dica', result: 'Resultado disponível no popup.', tryAgain: 'Tente novamente', restartModal: 'Começar de novo', done: 'Jogo concluído', back1: 'Voltar ao nível 1', levelDone: 'Nível superado', nextLevel: 'Próximo nível', wordDone: 'Palavra acertada', nextWord: 'Próxima palavra', noAttempts: 'Sem tentativas', timeOver: 'O tempo acabou', loading: 'Carregando...', theme: 'Tema', difficulty: 'Dificuldade', hidden: '(oculta)', enterLetter: 'Para letra, digite exatamente 1 caractere.', usedLetter: 'Essa letra já foi usada.', correctLetter: 'Correta! Você ganhou +{bonus}s.', wrongLetter: 'Letra incorreta: -1 tentativa.', invalidWord: 'Digite uma palavra válida (somente letras).', wrongWord: 'Palavra incorreta: -1 tentativa.', invalidInput: 'Digite uma letra ou palavra válida.', hintUsed: 'Dica aplicada: -{cost} pontos.', hintAlready: 'Não há mais dicas para esta palavra.', hintNeedLetter: 'Acerte ao menos 1 letra para pedir outra dica.', noPointsNeeded: 'Você não possui pontos suficientes.', hintL1: 'Tema: {theme}. A palavra tem {length} letras.', hintL2: 'Começa com "{first}" e termina com "{last}".', themeToggle: 'Modo claro/escuro' },
      };

      const ONLINE_MODE = true;
      const RANDOM_WORD_ENDPOINTS = ['https://random-word-api.herokuapp.com/word?number=1', 'https://random-word-api.vercel.app/api?words=1'];
      const MAX_LEVELS = LEVELS.length;
      const POINTS_PER_WORD = 1;
      const HINT_COSTS = [1, 3, 5];

      const labelLevelEl = document.getElementById('label-level');
      const labelPointsEl = document.getElementById('label-points');
      const labelTimeEl = document.getElementById('label-time');
      const labelAttemptsEl = document.getElementById('label-attempts');
      const labelErrorsEl = document.getElementById('label-errors');
      const labelBonusEl = document.getElementById('label-bonus');
      const usedLabelEl = document.getElementById('used-label');
      const langButtons = document.querySelectorAll('.lang-btn');
      const themeBtn = document.getElementById('theme-btn');

      const wordEl = document.getElementById('word');
      const timeEl = document.getElementById('time');
      const attemptsEl = document.getElementById('attempts');
      const errorsEl = document.getElementById('errors');
      const usedEl = document.getElementById('used');
      const messageEl = document.getElementById('message');
      const hintEl = document.getElementById('hint');
      const levelEl = document.getElementById('level');
      const pointsEl = document.getElementById('points');
      const metaEl = document.getElementById('meta');
      const bonusEl = document.getElementById('bonus');
      const guessForm = document.getElementById('guess-form');
      const guessInput = document.getElementById('guess-input');
      const hintBtn = document.getElementById('hint-btn');
      const restartBtn = document.getElementById('restart-btn');
      const modalEl = document.getElementById('result-modal');
      const modalTitleEl = document.getElementById('modal-title');
      const modalTextEl = document.getElementById('modal-text');
      const modalActionBtn = document.getElementById('modal-action');
      const appLogoEl = document.getElementById('app-logo');

      let currentLang = 'es';
      let currentTheme = 'dark';
      let levelIndex = 0;
      let levelPoints = 0;
      let secretWord = '';
      let currentHint = '';
      let guessedLetters = new Set();
      let wrongLetters = new Set();
      let attemptsLeft = 8;
      let timeLeft = 55;
      let timerId;
      let timerStarted = false;
      let gameOver = false;
      let hintStep = 0;
      let hintSteps = [];

      const usedWordsCache = new Set();
      const definitionCache = new Map();
      const translationCache = new Map();
      const offlineBagCache = new Map();

      const t = (key, vars = {}) => {
        let text = (I18N[currentLang] && I18N[currentLang][key]) || I18N.es[key] || key;
        Object.entries(vars).forEach(([k, v]) => { text = text.replaceAll(`{${k}}`, String(v)); });
        return text;
      };

      const logoLightSvg = `<svg xmlns='http://www.w3.org/2000/svg' width='680' height='140' viewBox='0 0 680 140'>
        <g fill='none' stroke='#000' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'>
          <path d='M22 118h170'/><path d='M52 118v-75h80'/><path d='M95 43l-43 50'/>
          <circle cx='132' cy='28' r='23'/><path d='M132 51v18'/><circle cx='132' cy='78' r='11'/><path d='M132 89v24'/>
          <path d='M116 113c0-10 7-18 16-18s16 8 16 18'/>
        </g>
        <text x='220' y='104' font-size='104' font-family='Arial, Helvetica, sans-serif' font-weight='700' fill='#000'>Memora</text>
      </svg>`;
      const logoDarkSvg = logoLightSvg.replaceAll("'#000'", "'#fff'");
      const logoLightSrc = `data:image/svg+xml;utf8,${encodeURIComponent(logoLightSvg)}`;
      const logoDarkSrc = `data:image/svg+xml;utf8,${encodeURIComponent(logoDarkSvg)}`;

      function setTheme(theme) {
        currentTheme = theme === 'light' ? 'light' : 'dark';
        if (currentTheme === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          appLogoEl.src = logoLightSrc;
        } else {
          document.documentElement.removeAttribute('data-theme');
          appLogoEl.src = logoDarkSrc;
        }
      }

      function applyLanguage() {
        document.documentElement.lang = currentLang;
        labelLevelEl.textContent = t('level');
        labelPointsEl.textContent = t('points');
        labelTimeEl.textContent = t('time');
        labelAttemptsEl.textContent = t('attempts');
        labelErrorsEl.textContent = t('errors');
        labelBonusEl.textContent = t('bonus');
        usedLabelEl.textContent = t('used');
        const nextHintCost = HINT_COSTS[Math.min(hintStep, HINT_COSTS.length - 1)];
        hintBtn.textContent = t('hintBtn', { cost: nextHintCost });
        restartBtn.textContent = t('restart');
        themeBtn.title = t('themeToggle');
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        const hintText = hintStep > 0 ? hintSteps[hintStep - 1] : t('hidden');
        hintEl.textContent = `${t('hintPrefix')}: ${hintText}`;
        if (!wrongLetters.size) usedEl.textContent = t('none');
        langButtons.forEach((btn) => btn.classList.toggle('active', btn.dataset.lang === currentLang));
      }

      function currentLevel() { return LEVELS[levelIndex]; }
      function levelAttempts(index) { if (index < 6) return 8; if (index < 12) return 7; if (index < 17) return 6; return 5; }
      function levelTime(index) { if (index < 6) return 55; if (index < 12) return 50; if (index < 17) return 45; return 40; }
      function levelWordBounds(index = levelIndex) { return WORD_LENGTH_RULES[index] || { min: 3, max: 16 }; }
      function isWordLengthAllowed(word, index = levelIndex) {
        const len = sanitizeWord(word).length;
        const bounds = levelWordBounds(index);
        return len >= bounds.min && len <= bounds.max;
      }
      function normalizeText(value) { return value.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().trim(); }
      function sanitizeWord(rawWord) { return normalizeText(rawWord).replace(/[^A-ZÑ]/g, ''); }

      function buildHintSteps(fullHint, word) {
        const cleanWord = sanitizeWord(word || secretWord);
        const first = cleanWord[0] || '';
        const last = cleanWord[cleanWord.length - 1] || '';
        const level1 = t('hintL1', { theme: currentThemeLabel, length: cleanWord.length || 0 });
        const level2 = t('hintL2', { first, last });
        const level3 = fullHint || t('hidden');
        return [level1, level2, level3];
      }

      async function fetchJsonWithTimeout(url, timeoutMs = 3000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, { signal: controller.signal });
          if (!res.ok) return null;
          return await res.json();
        } catch { return null; } finally { clearTimeout(timer); }
      }

      async function translateText(text, targetLang, sourceLang = 'auto') {
        if (!text || targetLang === sourceLang) return text;
        const key = `${sourceLang}|${targetLang}|${text}`;
        if (translationCache.has(key)) return translationCache.get(key);
        const data = await fetchJsonWithTimeout(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        let translated = text;
        if (Array.isArray(data) && Array.isArray(data[0])) {
          const built = data[0].map((part) => part[0]).join('').trim();
          if (built) translated = built;
        }
        translationCache.set(key, translated);
        return translated;
      }

      async function localizeWordEntry(entry) {
        const baseWord = sanitizeWord(entry.word);
        if (currentLang === 'es') return { word: baseWord, hint: entry.hint, theme: currentLevel().theme };

        const mappedWord = WORD_TRANSLATIONS[baseWord]?.[currentLang];
        const translatedWord = mappedWord ? sanitizeWord(mappedWord) : sanitizeWord(await translateText(baseWord.toLowerCase(), currentLang, 'es'));
        const translatedHint = await translateText(entry.hint, currentLang, 'es');
        const translatedTheme = await translateText(currentLevel().theme, currentLang, 'es');

        return {
          word: translatedWord || baseWord,
          hint: translatedHint || entry.hint,
          theme: translatedTheme || currentLevel().theme,
        };
      }

      async function fetchOnlineDefinitionEn(word) {
        const lower = word.toLowerCase();
        if (definitionCache.has(lower)) return definitionCache.get(lower);
        const data = await fetchJsonWithTimeout(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(lower)}`);
        let definition = `Word related to ${currentLevel().theme}.`;
        if (Array.isArray(data) && data[0]?.meanings?.length) {
          const firstDef = data[0].meanings[0]?.definitions?.[0]?.definition;
          if (firstDef) definition = firstDef;
        }
        definitionCache.set(lower, definition);
        return definition;
      }

      async function fetchOnlineWordEntry() {
        for (let i = 0; i < 8; i += 1) {
          const endpoint = RANDOM_WORD_ENDPOINTS[i % RANDOM_WORD_ENDPOINTS.length];
          const data = await fetchJsonWithTimeout(endpoint);
          const baseWord = Array.isArray(data) ? sanitizeWord(data[0] || '') : '';
          if (!baseWord || usedWordsCache.has(`${currentLang}:${baseWord}`) || !isWordLengthAllowed(baseWord)) continue;
          const definitionEn = await fetchOnlineDefinitionEn(baseWord);
          const localizedWord = currentLang === 'en' ? baseWord : sanitizeWord(await translateText(baseWord.toLowerCase(), currentLang, 'en'));
          const localizedHint = currentLang === 'en' ? definitionEn : await translateText(definitionEn, currentLang, 'en');
          if (!localizedWord || !isWordLengthAllowed(localizedWord)) continue;
          return { word: localizedWord, hint: localizedHint, theme: await translateText(currentLevel().theme, currentLang, 'es') };
        }
        return null;
      }

      async function pickOfflineWordEntry() {
        const baseWords = [...currentLevel().words];
        if (currentLang === 'es') baseWords.push(...(EXTRA_WORDS_ES[levelIndex] || []));

        const eligible = baseWords.filter((entry) => isWordLengthAllowed(entry.word));
        const words = eligible.length ? eligible : baseWords;
        const bagKey = `${currentLang}:${levelIndex}`;

        let bag = offlineBagCache.get(bagKey);
        if (!bag || !bag.length) {
          bag = [...words].sort(() => Math.random() - 0.5);
          offlineBagCache.set(bagKey, bag);
        }

        const entry = bag.pop() || words[Math.floor(Math.random() * words.length)];
        offlineBagCache.set(bagKey, bag);
        return localizeWordEntry(entry);
      }

      function shouldUseOnlineMode() {
        return ONLINE_MODE && currentLang === 'en';
      }

      async function pickWordEntry() {
        try {
          if (shouldUseOnlineMode()) {
            const online = await fetchOnlineWordEntry();
            if (online) return online;
          }
        } catch {}
        return pickOfflineWordEntry();
      }

      function renderWord() {
        wordEl.innerHTML = '';
        [...secretWord].forEach((letter) => {
          const el = document.createElement('div');
          el.className = 'letter';
          el.textContent = guessedLetters.has(letter) ? letter : '';
          wordEl.appendChild(el);
        });
      }

      let currentThemeLabel = currentLevel().theme;
      function updateStatus() {
        levelEl.textContent = `${levelIndex + 1}/${MAX_LEVELS}`;
        pointsEl.textContent = `${levelPoints}/${currentLevel().targetPoints}`;
        timeEl.textContent = String(timeLeft);
        attemptsEl.textContent = String(attemptsLeft);
        errorsEl.textContent = String(wrongLetters.size);
        usedEl.textContent = wrongLetters.size ? [...wrongLetters].join(', ') : t('none');
        bonusEl.textContent = `+${currentLevel().bonus}s`;
        metaEl.textContent = `${t('theme')}: ${currentThemeLabel} · ${t('difficulty')} ${levelIndex + 1}`;
      }

      function allLettersGuessed() { return [...secretWord].every((l) => guessedLetters.has(l)); }
      function revealWord() { [...secretWord].forEach((l) => guessedLetters.add(l)); renderWord(); }

      function openResultModal({ win, title, actionText, onAction, reason = '' }) {
        modalEl.classList.remove('hidden');
        modalTitleEl.textContent = title;
        modalTextEl.textContent = `${t('hintPrefix')}: ${currentHint}${reason ? ` · ${reason}` : ''}`;
        modalActionBtn.textContent = actionText;
        modalActionBtn.onclick = () => { modalEl.classList.add('hidden'); onAction(); };
        messageEl.textContent = t('result');
        messageEl.className = win ? 'message win' : 'message lose';
      }

      function finishLoss(reason = '') {
        gameOver = true;
        clearInterval(timerId);
        revealWord();
        openResultModal({ win: false, title: t('tryAgain'), actionText: t('restartModal'), reason, onAction: async () => startLevel() });
      }

      function finishWordSolved() {
        gameOver = true;
        clearInterval(timerId);
        levelPoints += POINTS_PER_WORD;
        updateStatus();
        if (levelPoints >= currentLevel().targetPoints) {
          if (levelIndex === MAX_LEVELS - 1) {
            openResultModal({ win: true, title: t('done'), actionText: t('back1'), onAction: async () => { levelIndex = 0; await startLevel(); } });
            return;
          }
          openResultModal({ win: true, title: t('levelDone'), actionText: t('nextLevel'), onAction: async () => { levelIndex += 1; await startLevel(); } });
          return;
        }
        openResultModal({ win: true, title: t('wordDone'), actionText: t('nextWord'), onAction: () => startRound() });
      }

      function consumeAttemptAndCheckLose(reason) {
        attemptsLeft -= 1;
        updateStatus();
        if (attemptsLeft <= 0) { finishLoss(reason); return true; }
        return false;
      }

      function startTimer() {
        clearInterval(timerId);
        timerId = setInterval(() => {
          if (gameOver) return clearInterval(timerId);
          timeLeft -= 1;
          updateStatus();
          if (timeLeft <= 0) finishLoss(t('timeOver'));
        }, 1000);
      }

      function ensureTimerStarted() {
        if (!timerStarted && !gameOver) { timerStarted = true; startTimer(); }
      }

      async function startRound() {
        gameOver = true;
        hintEl.textContent = `${t('hintPrefix')}: ${t('hidden')}`;
        messageEl.textContent = t('loading');
        messageEl.className = 'message';
        modalEl.classList.add('hidden');

        const entry = await pickWordEntry();
        secretWord = sanitizeWord(entry?.word || currentLevel().words[0].word);
        currentHint = entry?.hint || currentLevel().words[0].hint;
        currentThemeLabel = entry?.theme || currentLevel().theme;
        usedWordsCache.add(`${currentLang}:${secretWord}`);

        guessedLetters = new Set();
        wrongLetters = new Set();
        attemptsLeft = levelAttempts(levelIndex);
        timeLeft = levelTime(levelIndex);
        gameOver = false;
        timerStarted = false;
        hintStep = 0;
        hintSteps = buildHintSteps(currentHint, secretWord);
        hintBtn.textContent = t('hintBtn', { cost: HINT_COSTS[0] });

        messageEl.textContent = '';
        messageEl.className = 'message';
        renderWord();
        updateStatus();
        guessInput.value = '';
        guessInput.focus();
      }

      async function startLevel() { levelPoints = 0; await startRound(); }

      function handleLetterGuess(rawValue) {
        ensureTimerStarted();
        const guess = normalizeText(rawValue);
        if (!/^[A-ZÑ]$/.test(guess)) { messageEl.textContent = t('enterLetter'); messageEl.className = 'message lose'; return; }
        if (guessedLetters.has(guess) || wrongLetters.has(guess)) { messageEl.textContent = t('usedLetter'); messageEl.className = 'message'; return; }
        if (secretWord.includes(guess)) {
          guessedLetters.add(guess);
          timeLeft += currentLevel().bonus;
          renderWord();
          updateStatus();
          if (allLettersGuessed()) finishWordSolved();
          else { messageEl.textContent = t('correctLetter', { bonus: currentLevel().bonus }); messageEl.className = 'message win'; }
          return;
        }
        wrongLetters.add(guess);
        updateStatus();
        if (!consumeAttemptAndCheckLose(t('noAttempts'))) { messageEl.textContent = t('wrongLetter'); messageEl.className = 'message lose'; }
      }

      function handleWordGuess(rawValue) {
        ensureTimerStarted();
        const guessWord = normalizeText(rawValue);
        if (!guessWord || !/^[A-ZÑ]+$/.test(guessWord)) { messageEl.textContent = t('invalidWord'); messageEl.className = 'message lose'; return; }
        if (guessWord === secretWord) { revealWord(); updateStatus(); finishWordSolved(); return; }
        if (!consumeAttemptAndCheckLose(t('noAttempts'))) { messageEl.textContent = t('wrongWord'); messageEl.className = 'message lose'; }
      }

      guessForm.addEventListener('submit', (event) => {
        event.preventDefault();
        if (gameOver) return;
        const value = guessInput.value;
        guessInput.value = '';
        guessInput.focus();
        const normalized = normalizeText(value);
        if (!normalized) { messageEl.textContent = t('invalidInput'); messageEl.className = 'message lose'; return; }
        if (normalized.length === 1) handleLetterGuess(normalized); else handleWordGuess(normalized);
      });

      hintBtn.addEventListener('click', () => {
        if (gameOver) return;
        ensureTimerStarted();

        if (hintStep >= HINT_COSTS.length) {
          messageEl.textContent = t('hintAlready');
          messageEl.className = 'message';
          return;
        }

        if (hintStep > 0 && guessedLetters.size === 0) {
          messageEl.textContent = t('hintNeedLetter');
          messageEl.className = 'message';
          return;
        }

        const cost = HINT_COSTS[hintStep];
        if (levelPoints < cost) {
          messageEl.textContent = t('noPointsNeeded');
          messageEl.className = 'message lose';
          return;
        }

        levelPoints -= cost;
        hintStep += 1;

        hintEl.textContent = `${t('hintPrefix')}: ${hintSteps[hintStep - 1] || currentHint}`;
        updateStatus();
        hintBtn.textContent = t('hintBtn', { cost: HINT_COSTS[Math.min(hintStep, HINT_COSTS.length - 1)] });
        messageEl.textContent = t('hintUsed', { cost });
        messageEl.className = 'message';
      });

      restartBtn.addEventListener('click', async () => { await startLevel(); ensureTimerStarted(); });

      themeBtn.addEventListener('click', () => {
        setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        applyLanguage();
      });

      langButtons.forEach((btn) => {
        btn.addEventListener('click', async () => {
          currentLang = btn.dataset.lang || 'es';
          usedWordsCache.clear();
          offlineBagCache.clear();
          applyLanguage();
          await startRound();
        });
      });

      setTheme('dark');
      applyLanguage();
      startLevel();
    </script>
  </body>
</html>
